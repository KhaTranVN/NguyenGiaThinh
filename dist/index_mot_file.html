<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b5bd6">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Ôn thi cùng nhau</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📚%3C/text%3E%3C/svg%3E">
<style>
/* ===== Ôn thi cùng nhau — giao diện gọn, dịu mắt ===== */
:root{--bg:#f6f4ef;--card:#fffdf9;--ink:#23211e;--mut:#8b867c;--line:#e9e5db;--soft:#f0ece3;--ac:#2f4bff;--acs:#e8ecff;--ok:#18946a;--oks:#e4f5ee;--no:#df4b4b;--nos:#fdeaea;--r:16px;color-scheme:light;
  box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
:root[data-th="hoang"]{--ac:#f0643f;--acs:#ffe9e1;--bg:#faf1ea}
:root[data-th="bien"]{--ac:#0e9aa7;--acs:#dff3f5;--bg:#eef5f4}
:root[data-th="dem"]{--ac:#8b5cf6;--acs:#ece6fd;--bg:#f3f1f8}
@media (prefers-color-scheme:dark){
  :root{--bg:#12141b;--card:#1a1d26;--ink:#eceef4;--mut:#9aa0b2;--line:#2a2e3b;--soft:#222633;--ac:#8a9bff;--acs:#252b4a;--ok:#4cc79b;--oks:#15332a;--no:#ff8a8a;--nos:#3a2024;color-scheme:dark}
  :root[data-th="hoang"]{--ac:#ff8f6e;--acs:#3a2620;--bg:#17120f}:root[data-th="bien"]{--ac:#35c4d1;--acs:#12343a;--bg:#0f1517}:root[data-th="dem"]{--ac:#b197fc;--acs:#2a2347;--bg:#130f1d}
}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
main{max-width:640px;margin:0 auto;padding:18px 16px 110px}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
h1,h3,h4,p{margin:0}.ico{display:inline-flex}
/* trang chủ */
.hd{display:flex;align-items:center;gap:12px;margin:2px 0 14px}
.ava{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;cursor:pointer;background:var(--soft)}
.hd-t{flex:1;min-width:0}.hello{font-size:1.25rem;font-weight:750;letter-spacing:-.01em;user-select:none}
.sub{color:var(--mut);margin-top:2px;font-size:.92rem}
.ib{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:40px;height:40px;padding:0 9px;border-radius:12px}.ib:hover{background:var(--soft)}
.dot{position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--no);border:2px solid var(--bg)}
.mas{font-size:1.7rem;width:44px;height:44px;border-radius:14px;background:var(--soft);display:grid;place-items:center;transition:transform .2s}.mas:active{transform:scale(.9)}
.bubble{display:none;margin:-4px 0 12px;padding:10px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:.92rem}.bubble.on{display:block;animation:fade .25s}
.today{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);margin-bottom:12px}
.tt{flex:1;min-width:0;display:flex;flex-direction:column}.tt b{font-weight:650}.tt small{color:var(--mut)}.today>.ico{color:var(--mut)}
.ring{--p:0;isolation:isolate;position:relative;flex:none;width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--ac) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;font-size:.7rem;font-weight:700}
.ring::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--card);z-index:-1}.ring.full{background:var(--ok);color:#fff}.ring.full::before{display:none}
.cta{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 18px;border-radius:var(--r);background:var(--ac);color:#fff;margin:0 0 12px}.cta small{opacity:.85;color:#fff}.cta .tt b{font-size:1.02rem}
.soft{display:block;width:100%;padding:13px;border-radius:var(--r);background:var(--soft);font-weight:600;margin:0 0 12px;text-align:center}
.sec{margin:22px 4px 8px;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:700}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px}.item+.item{border-top:1px solid var(--line)}.item:active{background:var(--soft)}
.ic,.pn{flex:none;width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:1.35rem}
.pn{background:var(--acs);color:var(--ac);font-weight:700;font-size:1rem}.item.exam .ic{background:var(--acs)}
.it{flex:1;min-width:0;display:flex;flex-direction:column}.it b{font-weight:650}.it small{color:var(--mut)}.item>.ico{color:var(--mut)}
.bar{display:flex;justify-content:space-between;align-items:center;margin:-6px -8px 6px}.back span{font-size:.95rem}
.title{font-size:1.5rem;font-weight:800;margin:6px 0 2px;letter-spacing:-.02em}
.done-note{background:var(--oks);color:var(--ok);padding:10px 14px;border-radius:12px;font-weight:600;margin:12px 0}
/* thanh trên khi làm bài */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 -16px 6px;padding:8px 12px 0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px)}
.top .tt,.top .t{flex:1;min-width:0}.top .t{display:flex;flex-direction:column}.top small{display:block;color:var(--mut);font-size:.8rem}.top b{font-weight:700}.top .ava{display:none}
.top .b{min-height:36px;padding:0 12px}
.pbar{flex:1 1 100%;height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 4px 0}.pbar i{display:block;height:100%;background:var(--ac);transition:width .3s}
/* câu hỏi */
.q{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;margin:12px 0}
.q h3{font-size:1.05rem;font-weight:650;line-height:1.45;margin-bottom:14px;overflow-wrap:anywhere}
.q h3 em{display:block;font-style:normal;font-size:.76rem;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);font-weight:700;margin-bottom:6px}
.o{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;margin:8px 0;border:1.5px solid var(--line);border-radius:14px;background:var(--card);transition:border-color .15s,background .15s}
.o b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--mut)}
.o span{flex:1;overflow-wrap:anywhere}.o .ico{flex:none}.o:hover:not(:disabled){border-color:var(--ac)}.o:disabled{cursor:default}
.o.sel{border-color:var(--ac);background:var(--acs)}.o.sel b{background:var(--ac);color:#fff}
.o.ok{border-color:var(--ok);background:var(--oks)}.o.ok b{background:var(--ok);color:#fff}.o.ok .ico{color:var(--ok)}
.o.no{border-color:var(--no);background:var(--nos)}.o.no b{background:var(--no);color:#fff}.o.no .ico{color:var(--no)}
.fb{margin:10px 2px 0;font-size:.9rem;color:var(--mut)}.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}.fb.lucky{color:#c98200;font-weight:600}
.flag{font-size:.85rem;border-radius:10px;padding:8px 12px;margin:-4px 0 12px;line-height:1.45}
.flag.unk{background:var(--soft);color:var(--mut)}.flag.conf,.flag.unsure{background:rgba(240,163,10,.16);color:#a06b00}
.note{font-size:.88rem;color:var(--mut)}
/* nút */
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;background:var(--soft);font-weight:600;text-align:center}
.b.p{background:var(--ac);color:#fff}.b.on{background:var(--acs);color:var(--ac);box-shadow:inset 0 0 0 1.5px var(--ac)}.b.danger{background:var(--nos);color:var(--no)}
.b:disabled{opacity:.45;cursor:not-allowed}.b.big{width:100%;min-height:52px;margin:14px 0;font-size:1.02rem}
.nav{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.nav .b{flex:1 1 140px}
.lg{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.lg .b{flex:1 1 auto;min-width:0}.lg.wrap .b{flex:1 1 calc(50% - 8px);text-align:left;justify-content:flex-start}.lg.wrap .b:first-child{flex-basis:100%;justify-content:center}
.res{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 16px;margin:16px 0}
.res .ava{display:block;width:72px;height:72px;margin:0 auto 8px}.res b{display:block;font-size:1.35rem}.res p{color:var(--mut);margin-top:6px}
.score{font-size:2.2rem;font-weight:800;color:var(--ac)}
.letter{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin:8px 0}.letter.lock{color:var(--mut)}
.me{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:12px 0}
.inp{display:flex;align-items:center;gap:10px}.inp span{color:var(--mut)}
.inp .num{flex:1;min-width:0;font:inherit;font-size:1.15rem;font-weight:700;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.exT{font-weight:800;font-variant-numeric:tabular-nums;padding:6px 12px;border-radius:999px;background:var(--acs);color:var(--ac)}.exT.warn{background:var(--nos);color:var(--no)}
.tag{display:inline-block;font-size:.72rem;background:rgba(240,163,10,.18);color:#a06b00;border-radius:999px;padding:1px 8px;margin-left:6px;font-weight:700}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:12;width:50px;height:50px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.fab.l{left:16px;right:auto;width:auto;height:46px;padding:0 18px;border-radius:999px;background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:600}
/* hộp thoại, bảng trượt, thông báo */
#lb{position:fixed;inset:0;z-index:50;background:rgba(15,15,25,.55);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:22px}#lb.on{display:flex}
#lb .c{background:var(--card);border-radius:24px;padding:20px;text-align:center;max-width:340px;width:100%;animation:pop .3s}
#lb img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:18px;margin-bottom:12px}#lb .big{font-size:3.6rem;line-height:1.2}#lb h3{margin:6px 0}#lb p{margin:6px 0}#lb small{color:var(--mut)}
#sheet{position:fixed;inset:0;z-index:50;background:rgba(15,15,25,.45);display:none;align-items:flex-end}#sheet.on{display:flex}
#sheet .c{background:var(--card);width:100%;max-width:640px;margin:0 auto;border-radius:24px 24px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:78vh;overflow:auto;animation:up .25s}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 12px}#sheet h4{margin:0 0 12px;font-size:1.05rem}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}
.gr button{height:42px;border-radius:11px;border:1.5px solid var(--line);background:var(--card);font-weight:700}
.gr .ok{background:var(--oks);border-color:var(--ok);color:var(--ok)}.gr .no{background:var(--nos);border-color:var(--no);color:var(--no)}.gr .un{border-style:dashed;background:var(--soft)}.gr .ans{background:var(--acs);border-color:var(--ac);color:var(--ac)}.gr .cur{outline:2px solid var(--ac)}
.tgs{margin-top:4px}.tg{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 0}.tg+.tg{border-top:1px solid var(--line)}.tg span{flex:1;display:flex;flex-direction:column}.tg small{color:var(--mut)}
.sw{position:relative;flex:none;width:46px;height:28px;border-radius:999px;background:var(--line);transition:.2s}.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}.sw.on{background:var(--ac)}.sw.on::after{left:21px}
#bn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translate(-50%,-140%);transition:transform .35s;z-index:45;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:9px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.18);width:max-content;max-width:calc(100vw - 24px);cursor:pointer}
#bn.on{transform:translate(-50%,0)}#bn .i{font-size:1.5rem}#bn b{display:block;font-size:.92rem}#bn small{color:var(--mut)}
canvas.cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
/* thành tích */
.prof{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.pm{font-size:2.8rem;width:64px;height:64px;display:grid;place-items:center;background:var(--soft);border-radius:18px;flex:none}.pt{flex:1;min-width:0}.pt small{color:var(--mut);display:block}
.xp{height:6px;border-radius:6px;background:var(--line);margin:8px 0 4px;overflow:hidden}.xp i{display:block;height:100%;background:var(--ac)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center}.st b{display:block;font-size:1.15rem}.st small{color:var(--mut);font-size:.7rem}
.mys{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}.mys-img{position:relative;aspect-ratio:16/10;overflow:hidden;background:var(--soft)}
.mys-img img{width:100%;height:100%;object-fit:cover;filter:blur(var(--b,20px));transform:scale(1.12);transition:filter .6s}
.mys-p{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:2px 10px;font-size:.8rem}.mys-t{padding:12px 14px}.mys-t small{color:var(--mut);display:block}
.themes{display:flex;gap:14px}.th{width:44px;height:44px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--line);display:grid;place-items:center;font-size:.9rem}.th.on{box-shadow:0 0 0 2.5px var(--ink)}.th.lock{opacity:.45}
.bdg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.bd{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}
.bd .bi{font-size:1.6rem;display:block}.bd b{display:block;font-size:.8rem;margin-top:2px}.bd small{display:block;color:var(--mut);font-size:.68rem}.bd.lock{opacity:.45;filter:grayscale(1)}
.bk summary{cursor:pointer;font-weight:650;padding:18px 4px 8px;color:var(--mut)}.bkt{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:10px;font:inherit}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}}@keyframes pop{50%{transform:scale(1.02)}}@keyframes up{from{opacity:0;transform:translateY(12px)}}
@media (max-width:380px){.stats{grid-template-columns:repeat(2,1fr)}.bdg{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head><body>
<main id="app"><p style="padding:24px;font-family:sans-serif">Đang tải dữ liệu…</p></main><div id="lb"></div><div id="sheet"></div>
<!-- Dữ liệu và cấu hình -->
<script>
/* Danh sách môn theo thứ tự hiển thị (tên file trong data/ không kèm .js) */
window.MON_FILES=["cnxhkh", "luat", "nnl", "nnl100", "qtri"];

</script>
<script>
/* Cấu hình đề thi thử — có thể sửa trực tiếp */
window.CAU_HINH = {
  soCauMacDinh: 40,       // số câu điền sẵn trong ô nhập (người học có thể gõ số khác, từ 5 đến 300)
  phutMacDinh: 45,        // số phút điền sẵn trong ô nhập (người học có thể gõ số khác, từ 1 đến 600)
  tyLeMoRongToiDa: 0.1    // câu mở rộng chiếm tối đa 10% số câu của đề (0.1 = 10%)
};

</script>
<script>
/* ===== NỘI DUNG CÁ NHÂN HÓA — chỉ cần sửa file này để viết lời riêng cho em =====
   Có thể dùng {XUNG} (Anh/Chị) và {xung} (anh/chị) trong các câu chữ. */
window.CA_NHAN = {
  TEN: "em",              // cách gọi người học (ví dụ "Linh"); để trống nếu không cần
  XUNG: "Anh",            // người viết thư xưng là "Anh" hay "Chị"
  MUC_TIEU: 20,           // số câu mục tiêu mỗi ngày
  NGAY_THI: "",           // ngày thi, dạng "2026-12-20" (để trống = không hiện đếm ngược)
  ANH_CAN: 300,           // số câu đúng để "Bức ảnh bí mật" hiện rõ hoàn toàn
  ANH_LOI: "Ảnh đã hiện rõ rồi. Nhìn xem em đã đi xa đến đâu!",

  /* 5 lá thư mở khóa theo TỔNG SỐ CÂU ĐÚNG */
  THU: [
    { at: 25,  i: "💌", t: "Thư số 1", x: "Em ơi, 25 câu đúng đầu tiên rồi đó! Bắt đầu bao giờ cũng là phần khó nhất, và em vừa vượt qua nó. Cứ đều đều từng chút một nhé. — {XUNG}" },
    { at: 100, i: "💧", t: "Thư số 2", x: "100 câu đúng! {XUNG} tự hào về em lắm. Nhớ uống nước, đứng dậy vươn vai một chút rồi hãy học tiếp, đừng ép bản thân quá. Học bổng không chạy đi đâu mất đâu. — {XUNG}" },
    { at: 250, i: "💪", t: "Thư số 3", x: "Em đã đi được một quãng dài rồi. {XUNG} cũng từng có những hôm chỉ muốn bỏ cuộc, nhưng cố thêm một chút là lại thấy ổn. Em đang làm tốt hơn em nghĩ đấy. — {XUNG}" },
    { at: 500, i: "🌟", t: "Thư số 4", x: "500 câu đúng, nghe thôi đã thấy giỏi rồi! Dù điểm thi thế nào, {xung} vẫn luôn đứng phía sau cổ vũ em. Cố nốt chặng cuối nhé, {xung} tin em. — {XUNG}" },
    { at: 800, i: "🏆", t: "Thư cuối", x: "800 câu đúng! Đến đây thì không còn là may mắn nữa, mà là bản lĩnh của em. Chúc em vào phòng thi thật bình tĩnh và tự tin. Thi xong mình ăn mừng nhé! — {XUNG}" }
  ],

  /* "Thư hôm nay": mỗi ngày một lời nhắn khác nhau, lần lượt theo danh sách (thêm bao nhiêu tùy ý) */
  DAILY: [
    "Hôm nay chỉ cần làm 10 câu thôi cũng là một chiến thắng nhỏ rồi.",
    "Học không cần hoàn hảo, chỉ cần đều đặn.",
    "Quên là chuyện bình thường. Làm lại câu sai chính là cách nhớ lâu nhất đấy.",
    "Uống đủ nước chưa? Não hoạt động tốt hơn khi không khát.",
    "Mỗi câu đúng là một viên gạch xây lên điểm số cuối kỳ.",

[118,"Ông X là thợ xây, được chủ thầu là anh A thuê đi xây dựng công trình. Do bận về quê nên ông X đã tự ý cho con trai mình là anh H đi làm việc thay mà không hề nói trước với chủ thầu. Không may hôm đó giàn giáo bị sập nên anh H bị ngã, phải vào viện cấp cứu. Hai ngày sau, anh H bị chết tại bệnh viện. Hỏi: trong anh H được hưởng chế độ nào sau đây?",["Không được hưởng.","Được hưởng tiền trợ cấp tai nạn lao động.","Được hường tiền bồi thường tai nạn lao động.","Được hưởng tiền bồi thường và tiền trợ cấp tai nạn lao động."],0],
[119,"Chị H ký hợp đồng lao động để giúp việc gia đình cho ông bà E thừ tháng 04/2015. Tháng 8/2015, trong lúc đang làm việc nhà, chị H bị trượt chân cầu thang, ngã từ giữa cầu thang xuống tầng một. Hậu quả là chị bị chấn thương sọ não, gãy xương sống, suy giảm sức khoẻ 50% sức lao động. Hỏi: chỉ H được hưởng tiền trợ cấp tai nạn lao động là bao nhiêu tiền, biết rằng 2 tháng đầu chị được lương là 10 triệu/ tháng, thu nhập 12 triệu/tháng; các tháng sau chị được lương là 12 triệu/tháng, thu nhập 15 triệu/tháng.",["84 triệu","105 triệu","192.5 triệu","77 triệu"],0],
[120,"Điều kiển để hưởng tiền bồi thường tai nạn lao động là?",["Tai nạn lao động làm suy giảm từ 5% sức lao động hoặc chết và không do lỗi của người lao động.","Tai nạn lao động làm suy giảm từ 5% sức lao động hoặc chết và do lỗi của người lao động.","Tai nạn lao động làm suy giảm từ 10% sức lao động hoặc chết và không do lỗi của người lao động.","Tai nạn lao động làm suy giảm từ 10% sức lao động hoặc chết và do lỗi của người lao động."],0],
[121,"Điều kiện để hưởng tiền bồi thường bệnh nghề nghiệp là?",["Suy giảm từ 10% sức lao động do bệnh nghề nghiệp hoặc chết do bệnh nghề nghiệp khi đang làm việc, trước khi thôi việc, trước khi mất việc làm, trước khi nghỉ hưu.","Suy giảm từ 5% sức lao động do bệnh nghề nghiệp hoặc chết do bệnh nghề nghiệp khi đang làm việc, trước khi thôi việc, trước khi mất việc làm, trước khi nghỉ hưu.","Suy giảm từ 5% sức lao động do bệnh nghề nghiệp.","Chết do bệnh nghề nghiệp khi đang làm việc, trước khi thôi việc, trước khi mất việc làm, trước khi nghỉ hưu."],2],

[123,"Các bên có nghĩa vụ gì trong quá trình giải quyết tranh chấp lao động?",["Cung cấp đầy đủ tài liệu, thi hành mọi quyết định của cơ quan, tổ chức có thẩm quyền giải quyết tranh chấp.","Gửi đầy đủ mọi chứng cứ, tài liệu cho các cơ quan có thẩm quyền, thi hành tốt mọi quyết định giải quyết tranh chấp của cơ quan có thẩm quyền.","Phải cung cấp cho người có thẩm quyền giải quyết đầy đủ, kịp thời tài liệu, chứng cứ có liên quan đến yêu cầu giải quyết tranh chấp; Thực hiện các thỏa thuận đã đạt được; các quyết định của Ban trọng tài, bản án đã có hiệu lực pháp luật của Tòa án.","Cung cấp đầy đủ tài liệu cho cơ quan có thẩm quyền và thi hành mọi quyết định giải quyết tranh chấp của các cơ quan, tổ chức có thẩm quyền."],2],
[124,"Các cơ quan, cá nhân có thẩm quyền giải quyết tranh chấp lao động là?",["Hòa giải viên lao động, trọng tài viên lao động, tòa án nhân dân, chủ tịch Ủy ban nhân dân các cấp.","Hòa giải viên lao động, trọng tài lao động, tòa án nhân dân, chủ tịch Ủy ban nhân dân cấp huyện.","Tòa án nhân dân, Chủ tịch Ủy ban nhân dân, Viện kiểm sát nhân dân, Thanh tra nhân dân.","Hòa giải viên lao động, trọng tài lao động, Chủ tịch Ủy ban nhân dân cấp huyện, Giám đốc Sở Lao động - Thương binh và Xã hội."],1],
[125,"Các hành vi nào sau đây không bị nghiêm cấm trước, trong và sau khi đình công?",["Dùng bạo lực; hủy hoại máy, thiết bị, tài sản của người sử dụng lao động.","Cản trở việc thực hiện quyền đình công hoặc kích động, lôi kéo, ép buộc người lao động đình công; cản trở người lao động không tham gia đình công đi làm việc.","Các bên liên quan trực tiếp gặp gỡ để nghe ý kiến, hỗ trợ tìm biện pháp đưa hoạt động sản xuất, kinh doanh trở lại bình thường.","Trù dập, trả thù người lao động tham gia đình công, người lãnh đạo đình công."],2],

[155,"Tổ chức đại diện người lao động tổ chức và lãnh đạo đình công bắt đầu từ khi nào?",["Ngay sau khi quyết định đình công và thông báo về thời điểm bắt đầu đình công được gửi cho bên liên quan.","Đến thời điểm bắt đầu đình công, nếu người sử dụng lao động vẫn không chấp nhận giải quyết yêu cầu của người lao động.","Từ khi người sử dụng lao động, Ủy ban nhân dân cấp huyện và cơ quan chuyên môn về lao động thuộc Ủy ban nhân dân cấp tỉnh nhận được quyết định đình công.","Bất kỳ khi nào mà tổ chức đại diện người lao động tổ chức và lãnh đạo đình công thấy phù hợp."],1],
[156,"Tổ chức đại diện người lao động tổ chức và lãnh đạo đình công phải gửi văn bản về việc quyết định đình công cho cơ quan, tổ chức nào?",["Hòa giải viên lao động và cơ quan chuyên môn về lao động thuộc Ủy ban nhân dân cấp tỉnh.","Ủy ban nhân dân cấp huyện và cơ quan chuyên môn về lao động thuộc Ủy ban nhân dân cấp tỉnh.","Người sử dụng lao động, Ủy ban nhân dân cấp huyện và cơ quan chuyên môn về lao động thuộc Ủy ban nhân dân cấp tỉnh.","Tòa án nhân dân và Hội đồng trọng tài lao động."],2],
[157,"Tranh chấp lao động cá nhân là tranh chấp?",["Giữa người lao động với người lao động.","Giữa người lao động với người sử dụng lao động.","Giữa tập thể người lao động với người sử dụng lao động.","Giữa công đoàn với người sử dụng lao động"],1],
[158,"Tranh chấp nào sau đây là tranh chấp lao động tập thể về lợi ích?",["Khi một bên từ chối thương lượng hoặc không tiến hành thương lượng trong thời hạn theo quy định của pháp luật.","Có sự khác nhau trong việc hiểu và thực hiện quy định của thỏa ước lao động tập thể, nội quy lao động, quy chế và thỏa thuận hợp pháp khác;","Có sự khác nhau trong việc hiểu và thực hiện quy định của pháp luật về lao động;","Khi người sử dụng lao động có hành vi phân biệt đối xử đối với người lao động, thành viên ban lãnh đạo của tổ chức đại diện người lao động vì lý do thành lập, gia nhập, hoạt động trong tổ chức đại diện người lao động; can thiệp, thao túng tổ chức đại diện người lao động; vi phạm nghĩa vụ về thương lượng thiện chí."],0],
[159,"Tranh chấp nào sau đây thuộc thẩm quyền giải quyết của tòa án nhân dân cấp huyện?",["Tranh chấp lao động cá nhân không có yếu tố nước ngoài.","Tranh chấp lao động cá nhân có yếu tố nước ngoài.","Tranh chấp lao động tập thể không có yếu tố nước ngoài.","Tranh chấp lao động tập thể có yếu tố nước ngoài."],0],
[160,"Trình tự đình công như thế nào?",["Lấy ý kiến về đình công; Thông báo đình công và tiến hành đình công.","Lấy ý kiến về đình công; Ra quyết định đình công và thông báo đình công; Tiến hành đình công.","Ra quyết định đình công, thông báo đình công; Tiến hành đình công.","Lấy ý kiến về đình công; Tiến hành đình công."],1],
[161,"Trình tự, thủ tục giải quyết tranh chấp lao động tập thể về quyền như thế nào?",["Hoà giải viên lao động tiến hành hòa giải trước, nếu hoà giải không thành thì mỗi bên có quyền yêu cầu Hội đồng trọng tài lao động giải quyết. Ban trọng tài lao động được thành lập để giải quyết vụ tranh chấp, nếu một trong các bên không thi hành quyết định giải quyết tranh chấp của Ban trọng tài lao động thì có quyền yêu cầu Tòa án giải quyết.","Hoà giải viên lao động tiến hành hòa giải trước, nếu hoà giải không thành thì các bên chỉ có quyền yêu cầu Tòa án giải quyết.","Hoà giải viên lao động tiến hành hòa giải trước, nếu hoà giải không thành thì các bên có quyền đình công","Hoà giải lao động tiến hành giải quyết tranh chấp, nếu các bên không đồng ý với quyết định của hoà giải viên lao động thì các bên có quyền yêu cầu Hội đồng trọng tài lao động giải quyết hoặc đình công"],0],
[162,"Trình tự, thủ tục hòa giải tranh chấp lao động cá nhân như thế nào?",["Hoà giải viên lao động tiến hành hòa giải, nếu hoà giải không thành thì người lao động có quyền đình công hoặc khởi kiện ra Tòa án yêu cầu giải quyết tranh chấp.","Các bên tranh chấp khởi kiện ra Toà án, Toà án giải quyết tranh chấp theo thủ tục tố tụng dân sự.","Hoà giải viên lao động tiến hành hòa giải, nếu hoà giải không thành thì phải chuyển cho Hội đồng trọng tài lao động cấp tỉnh giải quyết","Hoà giải viên lao động hướng dẫn, hỗ trợ các bên thương lượng hòa giải, nếu hoà giải không thành thì mỗi bên tranh chấp có yêu cầu Hội đồng trọng tài lao động hoặc Toà án giải quyết, trừ một số tranh chấp pháp luật quy định."],3],

[164,"Trường hợp do sự kiện bất khả kháng, trở ngại khách quan thì thời hiệu yêu cầu giải quyết tranh chấp lao động cá nhân được tính như thế nào?",["Người yêu cầu chứng minh được vì sự kiện bất khả kháng, trở ngại khách quan đó không tính vào thời hiệu yêu cầu giải quyết tranh chấp lao động.","Được kéo dài đến 03 tháng, kể từ ngày xảy ra sự kiện bất khả kháng, trở ngại khách quan.","Được kéo dài đến 06 tháng, kể từ ngày xảy ra sự kiện bất khả kháng, trở ngại khách quan","Được kéo dài đến 12 tháng, kể từ ngày xảy ra sự kiện bất khả kháng, trở ngại khách quan."],1],

[169,"Hình thức xử phạt người có hành vi vi phạm quy định của pháp luật về lao động là gì?",["Phạt tiền, đình chỉ thu hồi giấy phép, buộc bồi thường, đóng cửa doanh nghiệp, khiển trách.","Cảnh cáo; phạt tiền; đình chỉ, tước quyền sử dụng giấy phép hoạt động, chứng chỉ nghề có thời hạn;","Cảnh cáo, phạt tiền, đình chỉ thu hồi giấy phép, đóng cửa doanh nghiệp.","Đình chỉ thu hồi giấy phép, đóng cửa doanh nghiệp, cảnh cáo, khiển trách, phạt tiền."],1],

[171,"Nội dung nào không thuộc nhiệm vụ quản lý nhà nước về lao động?",["Quyết định chính sách tiền lương đối với người lao động.","Giáo dục nghề nghiệp, phát triển kỹ năng nghề.","Kiểm tra, thanh tra, xử lý vi phạm pháp luật về lao động","Giải quyết đơn khởi kiện yêu cầu tranh chấp lao động."],1],

[182,"Quyết định xem chiến lược nào là tốt cho doanh nghiệp là quyết định thuộc chức năng nào :",["Tổ chức","Hoạch định","Lãnh đạo","Kiểm soát"],1],
[183,"Trong khi nghiên cứu cơ sở của lý thuyết hành vi về sự động viên, người ta không thầy có *",["Dạy cho công nhân hiếu về tâm lý và sự tác động của nó đối với năng suất lao động.","Sự thừa nhận nhu cầu xã hội của công nhân, và tạo điều kiện cho con người lao động cảm thấy hãnh diện về sự hữu ích và quan trọng của họ trong công việc chung.","Sự quan tâm nhiều hơn đến các nhóm không chính thức.","Nên cho người lao động tự do hơn để quyết định những gì liên quan đến công việc được giao."],0],
[184,"Kỹ thuật ra quyết định nào mà các thành viên trong nhóm không ngồi với nhau :",["Nhóm","Delphi","Danh nghĩa","Động não"],1],
[185,"Đặc điểm sau KHÔNG là đặc điểm của thuyết hai yếu tố là:",["Nhà quản trị phải đảm bảo các yếu tố duy trì để không gây ra sự bất mãn","Nhà quản trị phải đảm bảo các yếu tố động viên để tạo nên sự thỏa mãn","Nhà quản trị tạo nên sự thỏa mãn cho người lao động bằng cách xóa bỏ các nguyên nhân gây ra bất mãn","Phải thực hiện đúng yếu tố duy trì và và yếu tố động viên"],2],
[186,"Thuyết E.R.G bao gồm những nội dung sau, ngoại trừ :",["Mỗi một lúc người ta chỉ theo đuổi một nhu cầu","Trình tự thoa mãn nhu cầu không nhất thiết đi từ thấp đến cao","Khi một nhu cầu không thỏa mãn người ta sẽ chuyển sang thoả mãn nhu cầu khác","Con người theo đuổi 5 nhu cầu"],0],
[187,"Sau đây là những nhược điểm của cơ cấu trực tuyến, ngoại trừ:",["Không chuyên môn hóa","Hạn chế sử dụng chuyên gia","Khó khăn trong sự phối hợp hoạt động giữa các phòng ban","Dễ dẫn đến quản lý gia trưởng"],2],
[188,"Việc duy trì môi trường kinh doanh bình đẳng, chống độc quyền, chống phá giá thuộc nhóm yếu tố môi trường quản trị :",["Công nghệ","Kinh tế","Chính trị - pháp luật","Sự toàn cầu hóa kinh tế"],2],
[189,"Sau đây là những ưu điểm của cơ cấu tổ chức chức năng, ngoại trừ:",["Chế độ trách nhiệm rõ ràng","Sử dụng chuyên gia giỏi","Nhà quản trị không cần có kiến thức toàn diện","Dễ đào tạo nhà quản trị"],0],
[190,"Theo Herberg, yếu tố dẫn đến sự thỏa mãn của nhân viên KHÔNG bao gồm:",["Cơ hội phát triển","Trách nhiệm","Sự tiền bộ","Tiền lương"],3],
[191,"Để có thể đối phó kịp thời với sự thay đổi của môi trường bên trong và bên ngoài, yêu cầu khi thiết kế cơ cấu tổ chức phải đảm bảo nguyên tắc :",["Nguyên tắc an toàn và tin cậy","Nguyên tắc linh hoạt","Nguyên tắc phù hợp với môi trường","Nguyên tắc biến đổi"],1],
[192,"Sự điều tiết vĩ mô nền kinh tế Việt Nam thông qua các chính sách kinh tế, tài chính, đó là tác động đến doanh nghiệp từ môi trường :",["Tổng thể","Tác nghiệp","Kinh tế","Chính trị pháp luật"],3],
[193,"Quyết định các công việc thiết kế như thế nào nằm trong quyết định nào của nhà quản trị :",["Tổ chức","Hoạch định","Lãnh đạo","Kiểm soát"],0],
[194,"Một tổ chức có các đơn vị chức năng, các đơn vị này có quyền chỉ đạo cho rất nhiều đơn vị cấp dưới. Cơ cấu tổ chức phù hợp nhất là :",["Cơ cấu tổ chức trực tuyến","Cơ cấu tổ chức trực tuyến -chức năng","Cơ cấu tổ chức chức năng","Cơ cấu tổ chức ma trận"],2],
[195,"Bản chất tạo động lực lao động được cầu thành bởi yếu tố :",["Mục tiêu doanh nghiệp, sự nỗ lực, phần thưởng","Mục tiêu doanh nghiệp, nhu cầu, phần thưởng","Mục tiêu doanh nghiệp, nhu cầu, sự nỗ lực","Nhu cầu, sự nỗ lực, phần thưởng"],2],
[196,"Phát biểu nào sau đây về mô hình tổ chức là sai :",["Một công ty được sắp xếp gồm 4 phòng tài vụ, hành chánh - nhân sự, kế hoạch - kinh doanh và kỹ thuật ta gọi đó là tổ chức theo chức năng","Một công ty có tổng giám đốc công ty và các giám đốc phụ trách riêng từng loại sản phẩm của công ty, ta gọi đó là tổ chức theo sản phẩm","Một công ty có tổng giám đốc công ty và 3 giám đốc phụ trách: bán hàng cho đại lý, xuất khẩu hàng ra các nước và bán hàng cho tiêu dùng lẻ trong nước, ta gọi đó là tổ chức theo khách hàng","Một công ty có các mạng lưới đại lý ở các tỉnh, thành phố khắp nước thì ta gọi đó là tổ chức theo địa bàn hoạt động."],3],
[197,"Động cơ hành động của con người xuất phát mạnh nhất từ:",["Nhu cầu chưa được thoả mãn","Các nhu cầu của con người trong sơ đồ Maslow","Những gì mà nhà quản trị hứa sẽ thưởng sau khi hoàn thành","Các nhu cầu bậc cao"],0],
[198,"Nguyên tắc gắn liền với mục tiêu có ý nghĩa là :",["Bộ máy của đơn vị phải phù hợp với khách hàng mục tiêu của đơn vị","Bộ máy của đơn vị phải phù hợp với thị trường mục tiêu của đơn vị","Bộ máy của đơn vị phải phù hợp với quy trình sản xuất của đơn vị","Bộ máy của đơn vị phải phù hợp với mục tiêu của đơn vị"],3],
[199,"Sau đây là những ưu điểm của cơ cấu tổ chức ma trận, ngoại trừ :",["Sử dụng nhân lực có hiệu quả","Đáp ứng tình hình sản xuất kinh doanh biến động","Tăng năng suất lao động","Các nhà lãnh đạo giữa 2 tuyển phối hợp tốt"],2],

    const box = h("div", { class: "q" }, h("h3", {}, h("em", {}, "Câu " + (i + 1)), x.stem, x.src === "mr" ? h("span", { class: "tag" }, "⭐ câu mở rộng") : ""));
    x.opts.forEach((t, k) => box.append(h("button", { class: "o" + (k === x.ans ? " ok" : k === x.pick ? " no" : ""), disabled: "" }, h("b", {}, ABC[k]), h("span", {}, t))));
    box.append(h("div", { class: "note" }, (x.pick < 0 ? "⚠️ Bạn chưa trả lời câu này. " : "") + subName(x.sid) + (x.src === "on" ? " · Câu " + x.n : " · câu mở rộng") + (x.note ? " — " + x.note : "")));
    return box;
  });
  app.replaceChildren(
    h("div", { class: "top" }, h("div", { class: "t" }, av(1), h("div", {}, "Kết quả thi thử", h("small", {}, new Date(R.t0).toLocaleDateString("vi-VN")))), h("button", { class: "b", onclick: () => nav("#") }, "Trang chủ")),
    h("div", { class: "res", style: "margin-top:12px" }, av(2), h("b", {}, ok + " / " + N + " câu đúng"), h("div", { class: "score" }, (pc * 10).toFixed(1) + " điểm"),
      h("p", {}, pc >= .9 ? "Xuất sắc! 🏆" : pc >= .7 ? "Tốt lắm, giữ vững phong độ 💪" : pc >= .5 ? "Đạt rồi, ôn thêm các câu sai nhé 📚" : "Chưa đạt, đừng nản — xem lại câu sai rồi thi lại 🌱"),
      h("p", { class: "note" }, "Sai " + wrong + " · Bỏ trống " + un + " · Thời gian " + mmss(used) + "/" + R.mins + " phút" + (R.auto ? " (hết giờ, tự nộp)" : "")),
      h("p", { class: "note" }, "Từ ngân hàng ôn: " + o1 + "/" + n1 + (n2 ? " · Câu mở rộng: " + o2 + "/" + n2 : ""))),
    h("div", { class: "nav" }, h("button", { class: "b p", onclick: () => { EX = buildExam(R.sids, N, R.mins); exSave(); startTimer(); nav("#thithu-lam"); } }, "🔁 Thi lại"), h("button", { class: "b", onclick: () => nav("#thithu") }, "Đổi cài đặt")),
    h("div", { class: "lg" }, h("button", { class: "b" + (exWrongOnly ? "" : " on"), onclick: () => { exWrongOnly = false; examResult(R); } }, "Xem lại tất cả"), h("button", { class: "b" + (exWrongOnly ? " on" : ""), onclick: () => { exWrongOnly = true; examResult(R); } }, "Chỉ câu sai / bỏ trống")),
    h("div", {}, list));
  scrollTo(0, 0);
}

</script>
<script>
/* Nạp dữ liệu các môn từ thư mục data/ rồi khởi động ứng dụng.
   Hoạt động cả khi mở trực tiếp file index.html (không cần máy chủ). */
(function () {
  var SIZE = 25;                       // số câu mỗi phần (đừng đổi sau khi đã có người học: tiến độ lưu theo số thứ tự phần)
  var files = window.MON_FILES || [];
  function split(items) {
    var n = items.length, k = Math.max(1, Math.round(n / SIZE)), base = Math.floor(n / k), ex = n % k, out = [], i = 0;
    for (var x = 0; x < k; x++) { var st = base + (x < ex ? 1 : 0); out.push(items.slice(i, i + st)); i += st; }
    return out;
  }
  function finish() {
    files.forEach(function (id) {
      var m = (window.MON_HOC || []).filter(function (x) { return x.id === id; })[0];
      if (!m) return;
      m.parts = split(m.q).map(function (p) { return { s: p[0][0], e: p[p.length - 1][0], q: p }; });
      delete m.q; SUBJ.push(m);
    });
    if (!SUBJ.length) { document.getElementById('app').innerHTML = '<p style="padding:24px">Không tải được dữ liệu trong thư mục data/. Hãy kiểm tra data/manifest.js.<\/p>'; return; }
    startApp();
  }
  function load(i) {
    if (i >= files.length) return finish();
    if ((window.MON_HOC || []).some(function (x) { return x.id === files[i]; })) return load(i + 1);   // đã có sẵn (bản một file)
    var s = document.createElement('script'); s.src = 'data/' + files[i] + '.js';
    s.onload = function () { load(i + 1); }; s.onerror = function () { console.warn('Không tải được data/' + files[i] + '.js'); load(i + 1); };
    document.head.appendChild(s);
  }
  load(0);
})();

</script>
