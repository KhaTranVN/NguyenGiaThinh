<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b5bd6">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Ôn tập CNXHKH</title>
<style>
:root{--bg:#eef1ff;--bg2:#fdf0f7;--card:#fff;--tx:#1b2333;--mu:#667085;--bd:#e3e6f2;--ac:#5b5bd6;--ac2:#e0489a;--acs:#eceeff;--ok:#157f3b;--oks:#e3f6ea;--no:#c0302b;--nos:#fdeaea;--sh:0 4px 16px rgba(60,60,140,.10);
color-scheme:light;box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--bg2:#1a1030;--card:#1a1f33;--tx:#e8ebf3;--mu:#9aa3b8;--bd:#2c3350;--ac:#8f8fff;--ac2:#ff7ab8;--acs:#262b4d;--ok:#5fd68a;--oks:#173325;--no:#ff8a84;--nos:#3a1f20;--sh:0 4px 16px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1220;--bg2:#1a1030;--card:#1a1f33;--tx:#e8ebf3;--mu:#9aa3b8;--bd:#2c3350;--ac:#8f8fff;--ac2:#ff7ab8;--acs:#262b4d;--ok:#5fd68a;--oks:#173325;--no:#ff8a84;--nos:#3a1f20;--sh:0 4px 16px rgba(0,0,0,.35);color-scheme:dark}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px)}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(160deg,var(--bg),var(--bg2)) fixed;color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
main{max-width:760px;margin:0 auto;padding:14px 14px 90px}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;font:inherit;color:inherit}
.sub{color:var(--mu);margin:0 0 14px}
.hero{position:relative;min-height:230px;border-radius:22px;overflow:hidden;background:#222 center/cover;box-shadow:var(--sh);display:flex;flex-direction:column;justify-content:flex-end;padding:16px;color:#fff;margin-bottom:14px}
.hero{background-position:12% center}.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(40,40,120,.82),rgba(91,60,170,.45) 55%,rgba(224,72,154,.08)),linear-gradient(to top,rgba(0,0,0,.55),rgba(0,0,0,0) 55%)}
.hero>*{position:relative}
.hero small{opacity:.9;letter-spacing:.04em;text-transform:uppercase;font-size:.72rem}
.hero h1{margin:2px 0 4px;font-size:1.8rem;line-height:1.15;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.hero p{margin:0 0 10px;opacity:.95}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:rgba(255,255,255,.2);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:3px 11px;font-size:.85rem}
.avs{position:absolute;top:12px;left:16px;display:flex}.avs .av:not(:first-child){margin-left:-12px}.avs .av{cursor:pointer;transition:transform .2s}.avs .av:hover{transform:translateY(-3px) scale(1.08)}
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3);flex:none;background:#ddd}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.pc{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px 14px 14px 18px;cursor:pointer;text-align:left;box-shadow:var(--sh);transition:transform .15s}
.pc:active{transform:scale(.98)}.pc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(var(--c1),var(--c2))}
.pc .row{display:flex;align-items:center;gap:10px}.pc .row .av{width:34px;height:34px;border-color:var(--card);margin-left:auto}
.pc b{font-size:1.05rem}.pc span{display:block;color:var(--mu);font-size:.88rem}
.pc.done{border-color:#f5b301}.pc.done b::after{content:" ✓";color:#e0a000}
.bar{height:7px;background:var(--bd);border-radius:9px;margin:10px 0 6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c1),var(--c2));border-radius:9px;transition:width .4s}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;margin:0 -14px;padding:10px 14px 8px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top .t{flex:1;min-width:150px;font-weight:700;display:flex;align-items:center;gap:10px}.top .t>div{min-width:0}.top small{display:block;color:var(--mu);font-weight:500}
.pbar{flex:1 1 100%;height:5px;background:var(--bd);border-radius:9px;overflow:hidden}.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .3s}
button.b{background:var(--card);border:1px solid var(--bd);border-radius:11px;padding:8px 13px;font-size:.9rem;cursor:pointer}
button.b.p{background:linear-gradient(135deg,var(--ac),var(--ac2));border:0;color:#fff;font-weight:600}
.q{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:14px 0;box-shadow:var(--sh)}
.q h3{margin:0 0 12px;font-size:1.03rem;overflow-wrap:anywhere}.q h3 em{display:inline-block;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-style:normal;border-radius:8px;padding:0 8px;margin-right:6px;font-size:.88rem}
.o{display:flex;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:11px 12px;margin:7px 0;cursor:pointer;transition:background .15s,border-color .15s}
.o span{flex:1;overflow-wrap:anywhere}
.o b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--acs);color:var(--ac);display:grid;place-items:center;font-size:.85rem}
.o:hover:not(:disabled){border-color:var(--ac);background:var(--acs)}.o:disabled{cursor:default}
.o.ok{background:var(--oks);border-color:var(--ok);animation:pop .3s}.o.ok b{background:var(--ok);color:#fff}
.o.no{background:var(--nos);border-color:var(--no);animation:shake .3s}.o.no b{background:var(--no);color:#fff}
@keyframes pop{50%{transform:scale(1.02)}}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fb{display:flex;align-items:center;gap:8px;margin-top:8px;padding:6px 12px 6px 6px;border-radius:999px;font-weight:600;font-size:.9rem;animation:up .3s both;width:fit-content;max-width:100%}.fb.ok{background:var(--oks);color:var(--ok)}.fb.no{background:var(--nos);color:var(--no)}.fb .av{width:28px;height:28px;border-width:1.5px}.note{font-size:.85rem;color:var(--mu);margin-top:6px}
.res{text-align:center;border-radius:20px;padding:18px;margin:16px 0;background:linear-gradient(135deg,var(--acs),var(--card));border:1px solid var(--bd);box-shadow:var(--sh)}
.res .av{width:92px;height:92px;border:3px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,var(--ac),var(--ac2)) border-box;cursor:pointer}
.res b{display:block;font-size:1.5rem;margin-top:6px}.res p{margin:4px 0 0;color:var(--mu)}
.nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:12;border:0;border-radius:999px;padding:13px 18px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-weight:600;box-shadow:0 6px 18px rgba(91,91,214,.45);cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);opacity:0;pointer-events:none;transition:.25s;display:flex;gap:10px;align-items:center;padding:6px 16px 6px 6px;border-radius:999px;background:var(--card);box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:40;font-weight:600;max-width:calc(100vw - 100px)}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.ok{border:2px solid var(--ok)}#toast.no{border:2px solid var(--no)}
#lb{position:fixed;inset:0;z-index:50;background:rgba(10,10,30,.72);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px}
#lb.on{display:flex}#lb .c{background:var(--card);border-radius:24px;padding:18px;text-align:center;max-width:320px;width:100%;animation:pop .3s}
#lb img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:18px}#lb p{font-weight:700;margin:12px 0 4px;font-size:1.1rem}#lb small{color:var(--mu)}
canvas.cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
@keyframes up{from{opacity:0;transform:translateY(12px)}}@keyframes bob{50%{transform:translateY(-3px)}}@keyframes sweep{to{transform:translateX(120%)}}
.pc{animation:up .5s both}.hero{animation:up .5s both}
.hero h1{cursor:default;user-select:none}
.gold{display:flex;align-items:center;gap:14px;margin:0 0 14px;padding:14px 16px;border-radius:20px;cursor:pointer;background:linear-gradient(135deg,#fff4cc,#ffe0f0);color:#3b2a00;border:1px solid #f5d27a;box-shadow:var(--sh);animation:up .5s both}
.gold .st{display:flex}.gold .av{width:46px;height:46px;margin-left:-14px}.gold .st .av:first-child{margin-left:0}.gold b{display:block}.gold span{font-size:.9rem;opacity:.85}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.acts .b{flex:1 1 auto;min-height:46px;font-weight:600}
.b.danger{background:var(--nos);border-color:var(--no);color:var(--no)}
.hero.mini{min-height:120px}.hero.mini h1{font-size:1.35rem}.hero.mini p,.hero.mini .chips{display:none}
.fab.l{right:auto;left:14px;background:var(--card);color:var(--tx);border:1px solid var(--bd);box-shadow:var(--sh)}
#sheet{position:fixed;inset:0;z-index:50;background:rgba(10,10,30,.55);display:none;align-items:flex-end}#sheet.on{display:flex}
#sheet .c{background:var(--card);width:100%;max-width:760px;margin:0 auto;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:75vh;overflow:auto;animation:up .25s both}
#sheet h4{margin:0 0 10px}.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}
.gr button{height:42px;border-radius:11px;border:1px solid var(--bd);background:var(--card);font-weight:700;cursor:pointer}
.gr .ok{background:var(--oks);border-color:var(--ok);color:var(--ok)}.gr .no{background:var(--nos);border-color:var(--no);color:var(--no)}.gr .cur{outline:2px solid var(--ac)}
.lg{display:flex;gap:6px;margin:12px 0 0;flex-wrap:wrap}.lg .b{flex:1}.lg .b.on{background:var(--acs);border-color:var(--ac);color:var(--ac);font-weight:700}
@media (max-width:520px){main{padding:10px 10px 90px}.top{margin:0 -10px;padding:8px 10px}.hero{min-height:215px;padding:14px}.hero h1{font-size:1.5rem}
.grid{grid-template-columns:1fr 1fr;gap:10px}.pc{padding:12px 10px 12px 14px}.pc .row .av{width:28px;height:28px}
.top .t{flex:1 1 0;min-width:0}.top button.b{flex:none;min-height:40px}button.b{min-height:44px}.q{padding:13px;border-radius:15px}.o{min-height:48px;padding:12px 10px}.nav button{flex:1 1 45%}}
@media (max-width:360px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main id="app"></main><div id="lb"></div><div id="sheet"></div>
<script>
const D=[{"s":1,"e":25,"q":[[1,"Chủ nghĩa xã hội khoa học ra đời dựa trên những điều kiện nào ?",["Điều kiện kinh tế - xã hội","Điều kiện văn hoá - con người","Tiền đề khoa học tự nhiên và tư tưởng lý luận","Điều kiện kinh tế - xã hội; Tiền đề khoa học tự nhiên và tư tưởng lý luận"],3],[2,"Tác phẩm Tuyên ngôn của Đảng Cộng sản do C.Mác và Ph.Ăngghen soạn thảo và công bố trước toàn thế giới vào năm nào ?",["Năm 1847","Năm 1848","Năm 1849","Năm 1850"],1],[3,"C.Mác và Ph.Ăngghen phát triển chủ nghĩa xã hội khoa học qua các thời kỳ nào ?",["Thời kỳ từ 1848 đến năm 1852","Thời kỳ từ năm 1848 đến Công xã Pari (1871)","Thời kỳ sau Công xã Pari đến năm 1895","Thời kỳ từ năm 1848 đến Công xã Pari (1871); Thời kỳ sau Công xã Pari đến năm 1895"],3],[4,"Phạm trù nào được coi là cơ bản nhất, là xuất phát điểm của chủ nghĩa xã hội khoa học?",["Giai cấp công nhân","Sứ mệnh lịch sử của giai cấp công nhân","Chuyên chính vô sản","Xã hội chủ nghĩa"],1],[5,"Theo V.I.Lênin, tác phẩm nào của C.Mác là tác phẩm : trình bày chủ yếu và cơ bản chủ nghĩa xã hội khoa học?",["Phê phán Cương lĩnh Gôta","Tuyên ngôn của Đảng Cộng sản","Bộ Tư Bản","Hệ Tư tưởng Đức"],2],[6,"Phong trào cộng sản và công nhân quốc tế coi tác phẩm Tuyên ngôn của Đảng Cộng sản là :",["Cương lĩnh chính trị","Tuyên ngôn chính trị","Cương lĩnh đấu tranh","Tuyên ngôn đấu tranh"],0],[7,"Theo V.I.Lênin, chuyên chính vô sản là gì ?",["Là một hình thức chính quyền mới","Là một hình thức dân chủ mới","Là một hình thức quyền lực mới","Là một hình thức nhà nước mới"],3],[8,"Những hạn chế cơ bản của các nhà tư tưởng xã hội chủ nghĩa trước Mác là gì ?",["Chưa thấy được bản chất bóc lột và quá trình phát sinh phát triển và diệt vong tất yếu của chủ nghĩa tư bản","Không dùng bạo lực cách mạng để xoá bỏ chế độ tư bản chủ nghĩa","Không phát hiện được lực lượng xã hội tiên phong có thể thực hiện cuộc chuyển biến cách mạng từ chủ nghĩa tư bản lên chủ nghĩa xã hội và cộng sản chủ nghĩa","Tất cả các đáp án đều đúng"],3],[9,"Hãy chọn đáp án đúng làm rõ quan điểm của V.I.Lênin về thời kỳ quá độ lên chủ nghĩa xã hội ở nước Nga sau cách mạng Tháng Mười:",["Cần có những khoảng quá độ nhỏ trong thời kỳ quá độ nói chung lên chủ nghĩa xã hội","Cần có những giai đoạn quá độ nhỏ trong thời kỳ quá độ nói chung lên chủ nghĩa xã hội","Cần có những thời kỳ quá độ nhỏ trong thời kỳ quá độ nói chung lên chủ nghĩa xã hội","Cần có những bước quá độ nhỏ trong thời kỳ quá độ nói chung lên chủ nghĩa xã hội"],3],[10,"Các nhà kinh điển của chủ nghĩa Mác - Lênin coi chủ nghĩa xã hội khoa học là gì của giai cấp công nhân hiện đại ?",["Vũ khí lý luận","Công cụ lý luận","Cơ sở lý luận","Nền tảng lý luận"],0],[11,"Hãy điền vào chỗ trống: Phát kiến vĩ đại thứ nhất C.Mác và Ph.Ăngghen: “là sự khẳng định về mặt triết học sự…………..của chủ nghĩa tư bản và sự…………..của chủ nghĩa xã hội đều tất yếu như nhau”.",["sụp đổ……thắng lợi","tan vỡ……chiến thắng","sụp đổ……thành công","thất bại……chiến thắng"],0],[12,"Chọn từ thích hợp điền vào chỗ trống để hoàn thành câu sau: “ Những người cộng sản phải tiến hành…………………nhưng phải có chiến lược, sách lược khôn khéo và kiên quyết “.",["cách mạng liên tục","cách mạng liên tiếp","cách mạng không ngừng","cách mạng không dừng"],2],[13,"Chọn từ thích hợp điền vào chỗ trống để hoàn thành câu sau làm rõ quan điểm của V.I.Lênin về chế độ dân chủ: “ Chỉ có…………….., không có dân chủ thuần tuý hay dân chủ nói chung “.",["dân chủ tư sản hoặc dân chủ xã hội chủ nghĩa","dân chủ tư bản hoặc dân chủ vô sản","dân chủ tư sản hoặc dân chủ vô sản","dân chủ tư sản hoặc dân chủ cộng sản"],2],[14,"Chọn từ thích hợp điền vào chỗ trống để làm rõ quan điểm của Ph.Ăngghen về nhiệm vụ của chủ nghĩa xã hội khoa học : “Thực hiện sự nghiệp giải phóng thế giới ấy - đó là sứ mệnh lịch sử của ………….”.",["giai cấp vô sản hiện đại","giai cấp công nhân","giai cấp công nhân hiện đại","giai cấp vô sản"],0],[15,"C.Mác và Ph.Ăngghen đã sử dụng những thuật ngữ khác nhau để chỉ giai cấp công nhân là :",["Giai cấp vô sản","Giai cấp vô sản hiện đại","Giai cấp công nhân hiện đại","Tất cả đáp án đều đúng"],3],[16,"Theo các nhà kinh điển của chủ nghĩa Mác – Lênin, giai cấp công nhân đại diện cho :",["Lực lượng sản xuất tiên tiến, phương thức sản xuất hiện đại","Công cụ sản xuất tiên tiến, phương thức sản xuất hiện đại","Tư liệu sản xuất tiên tiến, phương thức sản xuất hiện đại","Quan hệ sản xuất tiên tiến, phương thức sản xuất hiện đại"],0],[17,"Công nhân nước nào được C.Mác và Ph.Ăngghen coi là đứa con đầu lòng của nền công nghiệp hiện đại ?",["Công nhân Anh","Công nhân Đức","Công nhân Pháp","Công nhân Nga"],0],[18,"Câu nói :” Thực hiện sự nghiệp giải phóng thế giới ấy – đó là sứ mệnh lịch sử của giai cấp vô sản hiện đại “ là của ai ?",["Các Mác","Ph.Ăngghen","Lênin","Hồ Chí Minh"],1],[19,"Sứ mệnh lịch sử của giai cấp công nhân được thực hiện trên mấy nội dung ?",["2 nội dung","3 nội dung","4 nội dung","5 nội dung"],1],[20,"Điều kiện khách quan quy định sứ mệnh lịch sử của giai cấp công nhân gồm :",["Địa vị kinh tế","Địa vị kinh tế và chính trị - xã hội","Địa vị chính trị","Địa vị xã hội"],1],[21,"Để thực hiện thắng lợi mục tiêu đưa nước ta trở thành một nước công nghiệp theo hướng hiện đại, xây dựng giai cấp công nhân Việt Nam trong thời kỳ mới cần thực hiện mấy giải pháp chủ yếu ?",["2 giải pháp","3 giải pháp","4 giải pháp","5 giải pháp"],3],[22,"Giai cấp công nhân Việt Nam ra đời và phát triển gắn liền với :",["Triều đình phong kiên nhà Nguyễn","Chính sách khai thác thuộc địa của thực dân Pháp ở Việt Nam","Chính sách khai thác thuộc địa của đế quốc Mỹ","Tất cả đáp án đều sai"],1],[23,"Việc nghiên cứu chủ nghĩa xã hội khoa học có ý nghĩa gì ?",["Ý nghĩa về mặt lý luận","Ý nghĩa về mặt thực tiễn","Ý nghĩa về mặt khoa học","Ý nghĩa về mặt lý luận; Ý nghĩa về mặt thực tiễn"],3],[24,"Giai cấp công nhân xét trên phương diện chính trị - xã hội, họ là những người:",["Tạo ra năng suất lao động cao, quá trình lao động mang tính chất xã hội hóa","Là đại biểu cho lực lượng sản xuất tiên tiến, cho phương thức sản xuất tiên tiến","Là một giai cấp cách mạng và có tinh thần cách mạng triệt để","Là giai cấp của những người lao động không có sở hữu tư liệu sản xuất chủ yếu của xã hội. Họ phải bán sức lao động cho nhà tư bản và bị chủ tư bản bóc lột và chiếm đoạt giá trị thặng dư"],3],[25,"Ở các nước xã hội chủ nghĩa, giai cấp công nhân là những người:",["Không có tư liệu sản xuất chủ yếu","Đã cùng nhân dân lao động làm chủ những tư liệu sản xuất chủ yếu và cùng nhau hợp tác lao động vì lợi ích chung của toàn xã hội trong đó có lợi ích chính đáng của bản thân họ","Phải đi bán sức lao động cho giai cấp tư sản","Không có tư liệu sản xuất chủ yếu và buộc phải đi bán sức lao động cho giai cấp tư sản"],1]]},{"s":26,"e":49,"q":[[26,"Sử mệnh lịch sử của giai cấp côn nhân được thể hiên trên các nội dung nào?",["Nội dung kinh tế.","Nội dung chính trị - xã hội","Nội dung văn hóa, tư tưởng","Tất cả các đáp án đều đúng"],3],[27,"Những điều kiện thuộc về nhân tố chủ quan để giai cấp công nhân hoàn thành sứ mệnh lịch sử của mình là:",["Sự phát triển của bản thân giai cấp công nhân về số lượng và chất lượng","Có Đảng Cộng sản lãnh đạo","Có sự liên minh giai cấp giữa giai cấp công nhân với giai cấp nông dân và các tầng lớp lao động khác","Tất cả các đáp án đều đúng"],3],[28,"Những biến đổi và khác biệt của giai cấp công nhân hiện đại là:",["Xu hướng trí tuệ hóa tăng nhanh","Xu hướng “trung lưu hóa” gia tăng","Là giai cấp giữ vai trò lãnh đạo, Đảng Cộng sản - đội tiên phong của giai cấp công nhân, giữ vai trò cầm quyền trong quá trình xây dựng chủ nghĩa xã hội ở một số quốc gia xã hội chủ nghĩa","Tất cả các đáp án đều đúng"],3],[29,"Thực hiện sứ mệnh lịch sử của giai cấp công nhân trong điều kiện thế giới ngày nay trên lĩnh vực văn hóa, tư tưởng trước hết là:",["Cuộc đấu tranh ý thức hệ, là cuộc đấu tranh giữa chủ nghĩa xã hội với chủ nghĩa tư bản","Cuộc đấu tranh giữa lực lượng sản xuất và quan hệ sản xuất","Cuộc đấu tranh giữa cơ sở hạ tầng và kiến trúc thượng tầng","Cuộc đấu tranh tư tưởng, là cuộc đấu tranh giữa tư tưởng xã hội chủ nghĩa với tư tưởng tư bản chủ nghĩa"],0],[30,"Hệ giá trị mới mà giai cấp công nhân cần phải tập trung xây dựng trên lĩnh vực văn hóa, tư tưởng để thực hiện sứ mệnh lịch sử của mình là gì?",["Lao động; công bằng; bình đẳng, tự do và dân chủ","Lao động; công bằng; dân chủ; bình đẳng và tự do","Lao động; công bằng; bình đẳng, tự do và hạnh phúc","Lao động; bình đẳng; công bằng; tự do và dân chủ"],1],[31,"Giai cấp công nhân Việt Nam từ khi ra đời mang những đặc điểm chủ yếu nào sau đây?",["Là giai cấp trực tiếp đối kháng với tư bản thực dân Pháp và bè lũ tay sai của chúng","Là lực lượng chính trị tiên phong để lãnh đạo cuộc đấu tranh giải phóng dân tộc","Gắn bó mật thiết với các tầng lớp nhân dân trong xã hội","Tất cả các đáp án đều đúng"],3],[32,"Hãy chọn đáp án đúng ?",["Lực lượng sản xuất hàng đầu của toàn nhân loại là giai cấp nông dân, là người lao động","Lực lượng sản xuất hàng đầu của toàn nhân loại là giai cấp vô sản là người lao động","Lực lượng sản xuất hàng đầu của toàn nhân loại là giai cấp công nhân, là người lao động.","Lực lượng sản xuất hàng đầu của toàn nhân loại là giai cấp công nhân và giai cấp nông dân"],2],[33,"Vì sao giai cấp công nhân Việt Nam sớm trở thành lực lượng chính trị độc lập và giữ vai trò lãnh đạo cách mạng Việt Nam?",["Vì sớm có mối quan hệ gắn bỏ với nông dân","Vì được kế thừa truyền thống bất khuất của dân tộc","Vì có số lượng đông và luôn đi đầu trong cuộc đấu tranh","Vì sớm giác ngộ ánh sáng của chủ nghĩa Mác - Lênin và hình thành một chính đảng thực sự cách mạng"],3],[34,"Hãy hoàn thành câu sau của C.Mác và Ph.Ăngghen và giai cấp công nhân: “các giai cấp khác đều suy tàn và tiêu vong cùng với sự phát triển của đại công nghiệp, còn giai cấp vô sản lại là ................ của bản thân nền đại công nghiệp”.",["con đẻ","sản phẩm","kết quả","hệ quả"],1],[35,"Hãy hoàn thành câu sau: Để thực hiện.....…..…..... của mình về nội dung kinh tế, giai cấp công nhân phải đóng vai trò nòng cốt trong quá trình giải phóng lực lượng sản xuất, thúc đẩy lực lượng sản xuất phát triển để tạo cơ sở cho quan hệ sản xuất mới, xã hội chủ nghĩa ra đời.",["sứ mệnh lịch sử","vai trò lịch sử","nhiệm vụ lịch sử","trọng trách lịch sử"],0],[36,"Điền từ thích hợp vào chỗ trống: “Giai cấp công nhân cùng với nhân dân lao động dưới sự lãnh đạo của Đảng Cộng sản, tiến hành cách mạng....... để lật đổ quyền thống trị của…........ xóa bỏ chế độ áp bức, bóc lột của chủ nghĩa tư bản, giành quyền lực về tay giai cấp công nhân và nhân dân lao động”.",["kinh tế....giai cấp tư bản","chính trị....giai cấp tư sản","văn hóa....giai cấp tư sản","tư tưởng....giai cấp tư bản"],1],[37,"Điền từ thích hợp vào chỗ trống để làm rõ quan điểm của các nhà kinh điển của chủ nghĩa Mác - Lênin về điều kiện chủ quan để giai cấp công nhân thực hiện sứ mệnh lịch sử: “Chất lượng giai cấp công nhân phải thể hiện ở trình độ trưởng thành về …..................của một giai cấp cách mạng”. ;",["ý thức chính trị","lập trường chính trị","quan điểm chính trị","tư tưởng chính trị"],0],[38,"Điền từ thích hợp vào chỗ trống: Trong thời kỳ đổi mới, Đảng ta đã xác định vai trò và sử mệnh lịch sử to lớn của giai cấp công nhân Việt Nam về nội dung kinh tế là: “giai cấp công nhân phát huy vai trò và trách nhiệm của lực lượng .................. trong sự nghiệp đẩy mạnh công nghiệp hóa, hiện đại hóa đất nước, làm cho nước ta trở thành một nước công nghiệp theo hướng hiện đại, có nền công nghiệp hiện đại, định hướng xã hội chủ nghĩa”.",["lãnh đạo","tiên phong","đi đầu","đầu đàn"],2],[39,"Chủ nghĩa xã hội ra đời từ những điều kiện nào?",["Điều kiện kinh tế","Điều kiện chính trị - xã hội","Điều kiện văn hóa - xã hội.","Điều kiện kinh tế; Điều kiện chính trị - xã hội"],3],[40,"Hai tiền đề vật chất quan trọng nhất của cuộc cách mạng xã hội chủ nghĩa là gì ?",["Sự phát triển của phương thức sản xuất và sự lớn mạnh của của giai cấp công nhân","Sự phát triển của công cụ sản xuất và sự phát triển của giai cấp công nhân","Sự phát triển của quan hệ sản xuất và sự trưởng thành của giai cấp công nhận","Sự phát triển của lực lượng sản xuất và sự trưởng thành của giai cấp công nhân"],3],[41,"Theo các nhà sáng lập chủ nghĩa xã hội khoa học, chủ nghĩa xã hội có mấy đặc trưng bản chất?",["4 đặc trưng","5 đặc trưng","6 đặc trưng","7 đặc trưng"],2],[42,"Quan điểm: “ Giữa xã hội tư bản chủ nghĩa và xã hội cộng sản chủ nghĩa là một thời kì cải biến cách mạng từ xã hội nọ sang xã hội kia. Thích ứng với thời kỳ ấy là một thời kỳ quá độ chính trị, và nhà nước của thời kì ấy không thể là cái gì khác hơn là nền chuyên chính cách mạng của giai cấp vô sản” là của ai ?",["C.Mác","Ph.Ăng ghen","C.Mác và Ph.Ăng ghen","V.LLênin"],0],[43,"Ai là người đưa ra tư tưởng độc lập dân tộc gắn liền với chủ nghĩa xã hội?",["V.L Lênin.","Hồ Chí Minh","Đặng Tiểu Bình","Phạm Văn Đồng"],1],[44,"Câu nói: “Tôi coi sự phát triển của những hình thái kinh tế xã hội là một quá trình lịch sử tự nhiên” là của ai ?",["C. Mác","Ph.Ăng ghen","C.Mác và Ph.Ăng ghen","V.I.Lênin"],0],[45,"“Thời kì phát triển mới - đẩy mạnh công nghiệp hoá, hiện đại hoá đất nước” được Đảng ta nêu ra ở Đại hội nào?",["Đại hội VI","Đại hội VI","Đại hội VIII","Đại hội IX"],2],[46,"Theo V.I.Lênin, mục đích cao nhất, cuối cùng của những cải tạo xã hội chủ nghĩa là gì?",["Thực hiện nguyên tắc: làm theo năng lực, hưởng theo lao động","Thực hiện nguyên tắc: làm theo khả năng, hưởng theo lao động","Thực hiện nguyên tắc: làm theo khả năng, hưởng theo nhu cầu","Thực hiện nguyên tắc: làm theo năng lực, hưởng theo nhu cầu"],3],[47,"Hình thái kinh tế - xã hội cộng sản chủ nghĩa bắt đầu và kết thúc khi nào?",["Từ khi Đảng Cộng sản ra đời và xây dựng xong chủ nghĩa xã hội","Bắt đầu từ thời kỳ quá độ cho đến khi xây dựng xong giai đoạn cao của xã hội cộng sản","Bắt đầu từ giai đoạn cao của xã hội cộng sản và kết thúc ở giai đoạn cao của xã hội công sản","Tất cả các đáp án đều sai"],1],[48,"Hãy chọn đảo án đúng theo quan điểm của Đảng ta về quá độ bỏ qua.",["Quá độ lên chủ nghĩa xã hội bỏ qua chế độ tư bản chủ nghía, tức là bỏ qua việc xác lập vị trí thống trị của giai cấp tư sản và chủ nghĩa tư bản","Quá độ lên chủ nghĩa xã hội bỏ qua chế độ tư bản chủ nghĩa, tức là bỏ qua việc xác lập vị trí thống trị của quan hệ sản xuất và kiến trúc thượng tầng tư bản chủ nghĩa","Quá độ lên chủ nghĩa xã hội bỏ qua chế độ tư bản chủ nghĩa, thống trị của quan hệ sản xuất cấp tư sản tức là bỏ qua việc xác lập vị trí tư bản chủ nghĩa và giai","Quá độ lên chủ nghĩa xã hội bỏ qua chế độ tư bản chủ nghĩa, tức là bỏ qua việc xác lập vị trí thống trị của quan hệ sản xuất và nhà nước tư sản."],1],[49,"Hãy chọn phương án đúng để hoàn thiện câu sau: “Chủ nghĩa xã hội, giai đoạn đầu của hình thái kinh tế - xã hội............”",["cộng sản chủ nghĩa","tư bản chủ nghĩa","chủ nghĩa tư bản","chủ nghĩa cộng sản"],0]]},{"s":50,"e":73,"q":[[50,"Hãy hoàn thiện cầu sau của C.Mác trong tác phẩm Phê phán cương lĩnh Gota: “Giữa xã hội tư bản chủ nghĩa và xã hội cộng sản chủ nghĩa là một thời kỳ................từ xã hội nọ sang xã hội kia”.",["cải tạo cách mạng","cải biến cách mạng","cải tạo xã hội","cải biến xã hội"],1],[51,"Chọn từ thích hợp điền vào chỗ trống trong câu sau: “Học thuyết hình thái kinh tế - xã hội của C.Mác không chỉ làm rõ những yếu tố cấu thành hình thái kinh tế - xã hội mà còn xem xét xã hội trong quá trình biến đổi và phát triển...........”.",["liên tục","không ngừng","không gián đoạn","liên tiếp"],1],[52,"Chọn từ thích hợp điền vào chỗ trống trong câu sau: “........... hình thái kinh tế - xã hội của chủ nghĩa Mác - Lênin đã chỉ ra tính tốt yếu sự thay thế hình thái kinh tế - xã hội cộng sản chủ nghĩa, đó là quá trình lịch sử tự nhiên”.",["học thuyết","quy luật","luận thuyết","lý thuyết"],0],[53,"Chủ trương phát triển nền kinh tế mà hiện nay Việt Nam đang hướng tới là: “Phát triển nền kinh tế mang theo định hướng xã hội chủ nghĩa, vận hành theo cơ chế thị trường có sự quản lý của nhà nước”.",["hàng hóa nhiều thành phần","hàng hóa ít thành phần","hàng hóa đa dạng","hàng hóa phong phủ"],0],[54,"Chọn phương án đúng để hoàn thiện câu sau: “Đặc điểm cơ bản của thời kỳ quá độ lên ............ là thời kỳ cải tạo cách mạng sâu sắc, triệt để xã hội tư bản chủ nghĩa trên tất cả các lĩnh vực...”.",["xã hội chủ nghĩa","chủ nghĩa xã hội","chủ nghĩa cộng sản","cộng sản chủ nghĩa"],1],[55,"Thuật ngữ dân chủ ra đời vào thời gian nào?",["Thế kỷ IX – VIII trước Công nguyên","Thế kỷ VIII – VII trước Công nguyên","Thế kỷ VII – VI trước Công nguyên","Thế kỷ VI – V trước Công nguyên"],2],[56,"Dân chủ là gì?",["Là quyền lực thuộc về nhân dân","Là quyền của con người","Là quyền tự do của mỗi người","Là trật tự xã hội"],0],[57,"Lịch sử nhân loại đã và đang trải qua bao nhiêu hình thức dân chủ ?",["2 hình thức","3 hình thức","4 hình thức","5 hình thức"],1],[58,"Phạm trù dân chủ xuất hiện khi nào?",["Ngay từ khi xuất hiện loài người.","Khi có nhà nước","Khi có nhà nước vô sản","Khi có nhà nước tư sản"],1],[59,"Dân chủ được xem xét dưới góc độ nào?",["Phạm trù chính trị","Phạm trù lịch sử","Phạm trù văn hóa","Tất cả các đáp án đều sai"],0],[60,"Giá trị nổi bật của nền dân chủ tư sản là:",["Quyền tự do, bình đẳng, bác ái","Quyền con người, bình đẳng, dân chủ","Quyền dân tộc, bình đẳng, dân chủ","Quyền tự do, bình đẳng, dân chủ"],3],[61,"Bản chất chính trị của nền dân chủ xã hội chủ nghĩa được thể hiện như thế nào?",["Là sự lãnh đạo của giai cấp công nhân thông qua Đảng của nó đối với toàn xã hội, để thực hiện quyền lực và lợi ích của toàn thể nhân dân lao động, trong đó có giai cấp công nhân","Là sự thực hiện quyền lực của giai cấp công nhân thông qua chính Đảng của nó để cải tạo xã hội cũ và xây dựng xã hội mới","Là sự lãnh đạo của giai cấp công nhân và nhân dân lao động đối với toàn xã hội.","Là sự thực hiện quyền lực của giai cấp công nhân thông qua Đảng của nó đối với toàn xã hội"],0],[62,"Theo quan điểm của chủ nghĩa Mác - Lênin, điểm khác biệt với nền dân chủ tư sản, bản chất của nền kinh tế xã hội chủ nghĩa là :",["Thực hiện chế độ công hữu về tư liệu sản xuất chủ yếu và thực hiện chế độ phân phối lợi ích theo nhu cầu là chủ yếu","Thực hiện chế độ công hữu về tư liệu sản xuất chủ yếu và thực hiện chế độ phân phối lợi ích theo kết quả lao động là chủ yếu","Thực hiện chế độ tư hữu tư nhân về tư liệu sản xuất chủ yếu và thực hiện chế độ phân phối lợi ích theo lao động là chủ yếu","Tất cả đáp án đều sai"],1],[63,"Cấu trúc cơ bản của hệ thống chính trị xã hội chủ nghĩa bao gồm:",["Đảng Cộng sản, Nhà nước xã hội chủ nghĩa","Đảng Cộng sản, Nhà nước xã hội chủ nghĩa, hệ thống pháp luật","Đảng Cộng sản Việt Nam, Nhà nước xã hội chủ nghĩa, các tổ chức chính trị- xã hội và các đoàn thể của quần chúng nhân dân","Tất cả các đáp án đều sai"],2],[64,"Xét về bản chất chính trị nền dân chủ xã hội chủ nghĩa có:",["Bản chất của giai cấp công nhân","Tính nhân dân rộng rãi","Tính dân tộc sâu sắc","Tất cả các đáp án đều đúng"],3],[65,"Theo quan điểm của chủ nghĩa Mác - Lênin, nhà nước xã hội chủ nghĩa ra đời là kết quả của cuộc cách mạng nào?",["Cuộc cách mạng do giai cấp vô sản và nhân dân lao động tiến hành dưới sự lãnh đạo của Đảng Cộng sản","Cuộc cách mạng do giai cấp công nhân và nhân dân lao động tiến hành dưới sự lãnh đạo của Đảng Cộng sản","Cuộc cách mạng do giai cấp vô sản và người lao động tiến hành dưới sự lãnh đạo của Đảng Tư sản","Cuộc cách mạng do giai cấp tư sản và nhân dân lao động tiến hành dưới sự lãnh đạo của Đảng Cộng sản"],0],[66,"Căn cứ vào tính chất của quyền lực nhà nước, chức năng của nhà nước được chia thành:",["Chức năng chính trị, kinh tế, văn hóa, xã hội....","Chức năng đối nội và chức năng đối ngoại","Chức năng giai cấp (trấn áp) và chức năng xã hội (tổ chức và xây dựng)","Tất cả các đáp án đều sai"],2],[67,"Theo quan điểm của chủ nghĩa Mác – Lênin, nội dung chủ yếu và mục đích cuối cùng của nhà nước xã hội chủ nghĩa là:",["Cải biến xã hội cũ, xây dựng thành công xã hội mới là nội dung chủ yếu và mục đích cuối cùng của nhà nước xã hội chủ nghĩa","Cải tạo xã hội cũ, phát triển thành công xã hội mới là nội dung chủ yếu và mục đích cuối cùng của nhà nước xã hội chủ nghĩa","Cải cách xã hội cũ, xây dựng thành công xã hội mới của nhà nước xã hội chủ nghĩa nội dung chủ yếu và mục đích cuối cùng","Cải tạo xã hội cũ, xây dựng thành công xã hội mới là nội dung chủ yếu và mục đích cuối cùng của nhà nước xã hội chủ nghĩa"],3],[68,"Nhà nước pháp quyền xã hội chủ nghĩa quản lý mọi mặt của đời sống xã hội bằng gì?",["Đường lối chính sách","Hiến pháp, pháp luật","Tuyên truyền, giáo dục","Tất cả các đáp án đều đúng"],1],[69,"Bản chất của nhà nước xã hội chủ nghĩa là:",["Mang bản chất của giai cấp công nhân","Mang bản chất của đa số nhân dân lao động","Mang bản chất của giai cấp công nhân, tính nhân dân rộng rãi và tính dân tộc sâu sắc","Vừa mang bản chất của giai các công nhân, vừa mang bản chất của nhân dân lao động và tính dân tộc sâu sắc."],2],[70,"So với các nền dân chủ trước đây, dân chủ xã hội chủ nghĩa có điểm khác biệt cơ bản nào?",["Không còn mang tính giai cấp","Là nền dân chủ phi lịch sử","Là nền dân chủ thuần tuỷ","Là nền dân chủ rộng rãi cho giai cấp công nhân và nhân dân lao động"],3],[71,"Hãy điền vào chỗ trống để hoàn thiện câu sau để làm rõ một trong những nội dung cơ bản của dân chủ: “về phương diện quyền lực, dân chủ là ............ thuộc về nhân dân, nhân dân là chủ nhân của nhà nước”.",["quyền hành","quyền bính","quyền lực","quyền lợi"],2],[72,"Chọn từ thích hợp điền vào chỗ trống đề hoàn thành câu sau: «Dân chủ có nghĩa là mọi ........... đều thuộc về nhân dân. Dân phải thực sự là ......... của xã hội và hơn nữa, dân phải được làm chủ một cách toàn diện.",["quyền lợi.....chủ nhân","quyền hành...chủ quản","quyền hạn....chủ thể","quyền lực....người chủ"],2],[73,"Hãy điền vào chỗ trống để làm rõ quan niệm về dân chủ: “Dân chủ là một…....... phản ánh những quyền cơ bản của con người; là một hình thức tổ chức nhà nước của giai cấp cầm quyền; có quá trình ra đời, phát triển cùng với lịch sử xã hội nhân loại “.",["giá trị vĩnh viễn","giá trị nhân loại","giá trị xã hội","giá trị chính trị"],2]]},{"s":74,"e":97,"q":[[74,"Tìm từ còn thiếu vào cho trống trong diễn đạt của V.l. Lênin: “Chế độ .............so với bất cứ chế độ dân chủ tư sản nào, cũng dân chủ hơn gấp........”",["dân chủ vô sản.....trăm lần","dân chủ xã hội chủ nghĩa....nghìn lần","dân chủ vô sản....triệu lần","dân chủ xã hội chủ nghĩa....vạn lần"],2],[75,"Nội dung cơ bản nhất mà nhờ đó chủ nghĩa xã hội từ không tưởng trở thành khoa học ?",["Lên án mạnh mẽ chủ nghĩa tư bản.","Phản ánh đúng khát vọng của nhân dân lao động bị áp bức.","Phát hiện ra giai cấp công nhân là lực lượng xã hội có thể thủ tiêu CNTB, xây dựng CNXH.","Chỉ ra sự cần thiết phải thay thế chủ nghĩa tư bản bằng chủ nghĩa xã hội."],2],[76,"Môn chủ nghĩa xã hội khoa học tập trung nghiên cứu loại cơ cấu xã hội nào ?",["cơ cấu xã hội – dân cư","cơ cấu xã hội - giai cấp","cơ cấu xã hội - nghề nghiệp","cơ cấu xã hội - dân tộc"],1],[77,"Sự biến đổi của cơ cấu xã hội - giai cấp gắn liền và được quy định bởi sự biến động của cơ cấu nào?",["Cơ cấu xã hội - dân số","Cơ cấu xã hội - kinh tế","Cơ cấu xã hội - dân tộc","Cơ cấu xã hội - dân cư"],1],[78,"Cơ cấu xã hội - giai cấp biến đổi trong mối quan hệ như thế nào?",["Vừa đấu tranh, vừa hợp tác","Vừa đấu tranh, vừa cắn bố","Vừa đấu tranh, vừa liên hệ","vừa đấu tranh, vừa liên minh"],3],[79,"V.I.Lênin đã xem liên minh giữa giai cấp công nhân với giai cấp nông dân và các tầng lớp xã hội khác trong bước đầu của thời kỳ quá độ lên chủ nghĩa xã hội là gì ?",["Là một hình thức liên kết đặc biệt","Là một hình thức liên doanh đặc biệt","Là một hình thức liên minh đặc biệt","Là một hình thức liên hệ đặc biệt"],2],[80,"Trong thời kỳ quá độ lên chủ nghĩa xã hội, cơ cấu xã hội giai cấp là:",["Hệ thống các giai cấp, nhóm cá nhân","Hệ thống các giai cấp, nhóm nghề nghiệp","Tổng thể các giai cấp, tầng lớp, các nhóm xã hội","Hệ thống các giai cấp, tầng lớp"],2],[81,"Theo quan điểm của Đảng Cộng sản Việt Nam, cơ cấu xã hội - giai cấp của Việt Nam ở thời kỳ quá độ lên chủ nghĩa xã hội bao gồm:",["Giai cấp công nhân, tầng lớp nông dân, đội ngũ trí thức, tầng lớp doanh nhân","Giai cấp vô sản, giai cấp nông dân, tầng lớp trí thức, đội ngũ doanh nhân","Giai cấp công nhân, giai cấp nông dân, tầng lớp lao động trí óc, tầng lớp doanh nhân","Giai cấp công nhân, giai cấp nông dân, đội ngũ trí thức, đội ngũ doanh nhân"],3],[82,"Theo C.Mác và Ph.Ăngghen, nguyên nhân dẫn đến thất bại trong cuộc đấu tranh của giai cấp công nhân chống lại sự áp bức, bóc lột của giai cấp tư sản ở châu Âu là:",["Do giai cấp vô sản “đơn độc” vì đã không tổ chức đoàn kết với “người bạn đồng minh tự nhiên” của mình là giai cấp nông dân","Do giai cấp công nhân “đơn độc” vì đã không tổ chức liên minh với “người bạn đồng minh tự nhiên” của mình là giai cấp nông dân","Do giai cấp công nhân “đơn độc” vì đã không tổ chức hợp tác với người bạn liên minh tự nhiên” của mình là giai cấp tư sản","Do giai cấp công nhân “đơn độc” vì đã không tổ chức liên kết với “người bạn đồng minh tự nhiên” của mình là giai cấp tiểu tư sản"],1],[83,"Yếu tố quyết định sự liên minh giữa giai cấp công nhân, giai cấp nông dân và tầng lớp trí thức là:",["Do giai cấp công nhân mong muốn","Do có cùng một kẻ thù là giai cấp tư sản","Do có những lợi ích cơ bản thống nhất với nhau","Do mục tiêu về chính trị của giai cấp công nhân"],2],[84,"Hãy điền vào chỗ trống nhằm làm rõ một trong những nội dung về sự biến đổi có tính quy luật của cơ cấu xã hội - giai cấp: \"Cơ cấu xã hội - giai cấp biến đổi trong mối quan hệ vừa....... vừa ......., từng bước xóa bỏ bất bình đằng xã hội dẫn đến sự xích lại gần nhau”.",["mâu thuẫn...liên minh","đấu tranh..hợp tác","đấu tranh...liên minh","đấu tranh...liên hiệp"],2],[85,"Hãy hoàn thành câu sau: “V.I.Lênin cũng khẳng định......................là vấn đề mang tính nguyên tắc để đảm bảo cho thắng lợi của cuộc cách mạng xã hội chủ nghĩa Tháng Mười Nga năm 1917”.",["liên minh công, nông","liên kết công, nông","đoàn kết","gắn kết công, nông"],0],[86,"Hãy hoàn thành câu sau của V.I.Lênin: “ Trước sự liên minh của các ........., giai cấp vô sản và giới kỹ thuật, không một thế lực đen tối nào đứng vững được”.",["đại biểu khoa học","nhà khoa học","chuyên gia khoa học","nhà nghiên cứu khoa học"],0],[87,"Hãy hoàn thiện câu sau: “ Xây dựng và thực hiện hệ thống chính sách xã hội tổng thể nhằm tạo sự biến đổi tích cực cơ cấu xã hội, nhất là các chính sách liên quan đến..............”.",["cơ cấu xã hội giai cấp","cơ cấu xã hội - kinh tế","cơ cấu xã hội - dân tộc","Tất cả các đáp án đều sai"],0],[88,"Dân tộc được hiểu theo mấy nghĩa cơ bản:",["Một","Hai","Ba","Bon"],1],[89,"Dân tộc hay quốc gia dân tộc có mấy đặc trưng cơ bản?",["2 đặc trưng","3 đặc trưng","4 đặc trưng","5 đặc trưng"],1],[90,"Dân tộc - tộc người có những đặc trưng cơ bản nào dưới đây?",["Cộng đồng về ngôn ngữ","Cộng đồng về văn hóa","Ý thức tự giác tộc người","Tất cả các đáp án đều đúng"],3],[91,"Các dân tộc ở Việt Nam phân bố chủ yếu ở địa bàn có vị trí chiến lược quan trọng là:",["Miền Bắc","Miền Trung","Miền Nam","Thiểu số"],3],[92,"Đối với các Đảng Cộng sản trên thế giới, Cương lĩnh dân tộc của chủ nghĩa Mác – Lênin là:",["Cơ sở lý thuyết quan trọng","Cơ sở thực tiễn quan trọng","Vừa là cơ sở lý luận vừa là cơ sở thực tiễn quan trọng","Là cơ sở lý luận quan trọng"],3],[93,"Dân tộc ở Việt Nam có bao nhiều đặc điểm cơ bản ?",["4 đặc điểm","5 đặc điểm","6 đặc điểm","7 đặc điểm"],2],[94,"Tính chất chính trị của tôn giáo chỉ xuất hiện khi nào?",["Khi xã hội chưa phân chia giai cấp","Khi xã hội có áp bức giai cấp","Khi xã hội đã phân chia giai cấp","Khi xã hội có mâu thuẫn giai cấp"],2],[95,"Tôn giáo Việt Nam có mấy đặc điểm cơ bản?",["3 đặc điểm","4 đặc điểm","6 đặc điểm","7 đặc điểm"],2],[96,"Giữa chủ nghĩa Mác - Lênin và hệ tư tưởng tôn giáo khác nhau ở điểm nào?",["Khác nhau về thế giới quan","Khác nhau về nhân sinh quan","Khác nhau ở con đường mưu cầu hạnh phúc cho nhân dân","Tất cả các đáp án đều đúng"],3],[97,"Các thế lực thù địch thường xuyên lợi dụng vấn đề dân tộc và vấn đề tôn giáo nhằm thực hiện “diễn biến hòa bình”, tập trung ở mấy khu vực trọng điểm ?",["2 khu vực","3 khu vực","4 khu vực","5 khu vực"],2]]},{"s":98,"e":121,"q":[[98,"Hãy chọn đáp án đúng về tín ngưỡng và tôn giáo:",["Tôn giáo và tín ngưỡng đồng nhất","Tôn giáo và tín ngưỡng không đồng nhất, nhưng có giao thoa nhất định","Tôn giáo và tín ngưỡng không có giao thoa","Tất cả các đáp án đều sai"],1],[99,"Tôn giáo có nguồn gốc gì?",["Nguồn gốc tự nhiên, kinh tế - xã hội","Nguồn gốc nhận thức","Nguồn gốc tâm lý.","Tất cả các đáp án đều đúng"],3],[100,"Tôn giáo là sản phẩm của những điều kiện kinh tế - xã hội, phản ánh lợi ích, nguyện vọng của các giai cấp khác nhau trong cuộc đấu tranh giai cấp, đấu tranh dân tộc, vì vậy:",["Tôn giáo mang tính quần chủng","Tôn giáo không có tính lịch sử","Tôn giáo mang tính chính trị","Tôn giáo không mang tính quần chúng"],2],[101,"Chọn từ thích hợp điền vào chỗ trống: “Dân tộc - .......... là cộng đồng người được hình thành lâu dài trong lịch sử và có ba đặc trưng cơ bản: cộng đồng về ngôn ngữ, cộng đồng về văn hóa và ý thức tự giác tộc người”.",["quốc gia","thiểu số","tộc người","Tất cả các đáp án đều sai"],2],[102,"Chọn từ thích hợp điền vào chỗ trống trong câu sau để làm rõ xu hướng khách quan của sự phát triển dân tộc: “Cộng đồng dân cư muốn.........để hình thành cộng đồng........độc lập”.",["nhập vào....tộc người","tách ra......dân tộc.","liên hiệp lại....dân tộc","Tất cả các đáp án đều sai"],1],[103,"Chọn từ thích hợp điền vào chỗ trống để hoàn thành câu sau: Việt Nam “có sự......... về số dân giữa các .........”",["khác biệt.... dân tộc","khác nhau…...tộc người","cách biệt....dân tộc","chênh lệch....tộc người"],3],[104,"Hãy điền vào chỗ trống hoàn thành câu sau: “Quan hệ dân tộc và tôn giáo ở Việt Nam chịu sự chi phối mạnh mẽ bởi............”.",["văn hóa truyền thống","tôn giáo truyền thống","đạo đức truyền thống","tín ngưỡng truyền thống"],3],[105,"Hãy điền vào chỗ trống để hoàn thành câu sau: \"Giải quyết mối quan hệ dân tộc và tôn giáo phải đặt trong mối ............ với cộng đồng quốc gia - dân tộc thống nhất, theo………………… xã hội chủ nghĩa”.",["quan hệ....định hướng","liên hệ....con đường","liên lạc.....mục tiêu","gắn kết....định hướng."],0],[106,"Gia đình được hình thành dựa trên những mối quan hệ cơ bản nào?",["Quan hệ hôn nhân (vợ và chồng)","Quan hệ huyết thống (cha mẹ và con cái...)","Quan hệ xã hội","Quan hệ hôn nhân và quan hệ huyết thống"],3],[107,"Quan hệ được coi là cơ sở, nền tảng hình thành nên các mối quan hệ khác trong gia đình, là cơ sở pháp lý cho sự tồn tại của mỗi gia đình là:",["Quan hệ huyết thống","Quan hệ nuôi dưỡng","Quan hệ hôn nhân","Quan hệ cá nhân"],2],[108,"Tác phẩm “Nguồn gốc của gia đình, của chế độ tư hữu và của Nhà nước” là của ai?",["C.Mác","C.Mác & Ph.Ăng ghen","Ph.Ăng ghen","V.I. Lênin"],2],[109,"Chức năng đặc thù của gia đình là:",["Tái sản xuất ra con người","Kinh tế và tổ chức tiêu dùng","Nuôi dưỡng, giáo dục gia đình","Thoả mãn nhu cầu tâm sinh lý, duy trì tình cảm gia đình"],0],[110,"Sự biến đổi của gia đình Việt Nam trong thời kỳ quá độ lên chủ nghĩa xã hội:",["Được coi là “gia đình quá độ”","Gia đình biến đổi","Gia đình “tiếp biến”","Gia đình tiếp nối"],0],[111,"Chức năng thỏa mãn nhu cầu tâm sinh lý, duy trì tình cảm gia đình là :",["Chức năng phổ biến của gia đình","Chức năng thường xuyên của gia đình","Chức năng không thường xuyên của gia đình","Chức năng không phổ biến của gia đình"],1],[112,"Nội dung cơ bản và trực tiếp để xây dựng gia đình ở Việt Nam hiện nay là:",["Phát triển kinh tế - xã hội","Nâng cao trình độ dân trí cho nhân dân lao động","Xây dựng gia đình no ấm, bình đẳng, tiến bộ và hạnh phúc","Giải phóng người phụ nữ"],2],[113,"Có bao nhiêu phương hướng cơ bản xây dựng và phát triển gia đình Việt Nam trong thời kỳ quá độ lên chủ nghĩa xã hội?",["3 phương hướng","4 phương hướng","5 phương hưởng","6 phương hướng"],1],[114,"Vị trí của gia đình trong xã hội:",["Gia đình là tổ ấm, mang lại các giá trị hạnh phúc, sự hài hòa trong đời sống cá nhân của mỗi thành viên; Gia đình là cầu nối giữa cá nhân với xã hội","Gia đình là tế bào của xã hội; Gia đình là tổ ấm, mang lại các giá trị hạnh phúc, sự hài hòa trong đời sống cá nhân của mỗi thành viên; Gia đình là cầu nối giữa cá nhân với xã hội","Gia đình là tế bào của xã hội; Gia đình là tổ ấm; Gia đình là cầu nối giữa cá nhân với xã hội","Tất cả các đáp án đều sai"],1],[115,"Chế độ hôn nhân tiến bộ bao gồm:",["Hôn nhân tự nguyện","Hôn nhân một vợ một chồng, vợ chồng bình đẳng","Hôn nhân được đảm bảo về pháp lý","Tất cả các đáp án đều đúng"],3],[116,"Chọn từ thích hợp điền vào chỗ trống trong câu sau: “ gia đình tham gia.........vào quá trình sản xuất và tái sản xuất ra tư liệu sản xuất và tư liệu tiêu dùng ”.",["trực tiếp","gián tiếp","từ đầu","liên tục"],0],[117,"Hãy điền vào chỗ trống trong câu sau: “quan tâm xây dựng quan hệ xã hội,.........bình đẳng, hạnh phúc là vấn đề hết sức............. trong cách mạng xã hội chủ nghĩa”.",["quan hệ gia đình...quan trọng","quan hệ tập thể...cần thiết","quan hệ cá nhân...cấp thiết","quan hệ dân tộc...cấp bách"],0],[118,"Sự biến đổi trong việc thực hiện chức năng tái sản xuất ra con người của gia đình Việt Nam trong thời kỳ quá độ lên chủ nghĩa xã hội là:",["Hiện nay, việc sinh con được các gia đình tiến hành một cách chủ động, tự giác","Thông điệp mới trong kế hoạch hóa gia đình là mỗi cặp vợ chồng nên sinh đủ hai con","Trong gia đình hiện đại sự bền vững của hôn nhân phụ thuộc vào nhiều yếu tố tâm lý, tình cảm, kinh tế chứ không chỉ là yếu tố có con hay không có con","Tất cả các đáp án đều sai"],0],[119,"Chọn từ thích hợp điền vào chỗ trống để hoàn thành câu sau: “Gia đình là ......... của xã hội”.",["nền tảng","cơ sở","tế bào","đơn vị"],2],[120,"Hãy hoàn thành câu sau làm rõ nội dung về chế độ hôn nhân: “Hôn nhân ............ là hôn nhân xuất phát từ ..........giữa nam và nữ”.",["tiên tiến...tình cảm","tiến bộ...tình yêu","lành mạnh….tình cảm","hiện đại....tình yêu"],1],[121,"Từ khi ra đời (1848) đến nay, chủ nghĩa xã hội khoa học phát triển qua bao nhiêu giai đoạn chủ yếu ?",["2 giai đoạn","3 giai đoạn","4 giai đoạn","5 giai đoạn"],1]]},{"s":122,"e":145,"q":[[122,"Theo quan điểm của chủ nghĩa Mác - Lênin, nguyên tắc phân phối nào là chủ đạo trong thời kỳ quá độ lên chủ nghĩa xã hội?",["Phân phối theo mức độ góp vốn","Phân phối theo nhu cầu","Phân phối theo lao động","Phân phối theo quyền sở hữu tư liệu sản xuất"],2],[123,"Giai cấp công nhân được các nhà kinh điển của chủ nghĩa Mác- Lênin xác định trên các phương diện cơ bản:",["Kinh tế - xã hội","Chính trị - xã hội","Kinh tế - xã hội; Chính trị - xã hội","Kinh tế - chính trị - xã hội"],2],[124,"Theo Hồ Chí Minh, đặc điểm lớn nhất của thời kỳ quá độ lên chủ nghĩa xã hội ở Việt Nam là:",["Bị chiến tranh tàn phá nặng nề","Từ một nước nông nghiệp lạc hậu tiến thẳng lên chủ nghĩa xã hội, không phải kinh qua giai đoạn phát triển tư bản chủ nghĩa","Từ một nước nông nghiệp độc canh lúa tiến lên chủ nghĩa xã hội","Từ một nước công nghiệp phát triển tiến thẳng lên chủ nghĩa xã hội"],1],[125,"Đảng Cộng sản ra đời là kết quả của sự kết hợp giữa :",["Chủ nghĩa Mác – Lênin với phong trào công nhân","Chủ nghĩa Mác – Lênin với phong trào yêu nước","Phong trào công nhân với phong trào yêu nước","Chủ nghĩa Mác – Lênin với phong trào công nhân và phong trào yêu nước"],0],[126,"Giai cấp công nhân ở trình độ trưởng thành trong cuộc đấu tranh giai cấp chống chủ nghĩa tư bản là :",["Tự phát","Tự giác","Đấu tranh chính trị, có Đảng Cộng sản lãnh đạo","Tất cả đáp án đều đúng"],2],[127,"Điền từ thích hợp vào chỗ trônga : “ Giai cấp công nhân thực hiện một cuộc cách mạng về..................bao gồm cải tạo cái cũ cái lỗi thời, lạc hậu, xây dựng cái mới, tiến bộ trong tâm lý, lối sống và trong đời sống tinh thần xã hội “.",["văn hóa","tư tưởng","văn hóa, tư tưởng","chính trị"],2],[128,"Theo quan điểm của chủ nghĩa Mác - Lênin, cách mạng vô sản là cuộc cách mạng của :",["Giải cấp nông dân và nhân dân lao động","Giai cấp công nhân và những người lao động","Giai cấp công nhân và nhân dân lao động","Tầng lớp trí thức và nhân dân lao động"],2],[129,"Chọn từ thích hợp điền vào chỗ trống trong câu sau: “ Gắn liền với cách mạng khoa học và công nghệ hiện đại, với sự phát triển ............., công nhân hiện đại có xu hướng...........hóa “.",["kinh tế tri thức....trí tuệ","kinh tế hàng hóa....trí thức","kinh tế thị trưởng....trí thức","kinh tế xã hội chủ nghĩa....hiện đại"],0],[130,"Nhà nước pháp trị và Nhà nước pháp quyền có điểm nào giống nhau?",["Dùng pháp luật để quản lý xã hội","Khẳng định quyền lực tối cao của pháp luật","Khẳng định mối quan hệ trách nhiệm giữa nhà nước và công dân, công dân và nhà nước","Quan chức nhà nước do nhân dân bầu ra và bãi miễn"],0],[131,"Nhà nước pháp quyền xã hội chủ nghĩa ở Việt Nam là nhà nước:",["Mang bản chất giai cấp công nhân, đồng thời cũng gắn bó chặt chẽ với dân tộc, với nhân dân","Mang bản chất của giai cấp nông dân","Mang bản chất của các tầng lớp nhân dân lao động","Mang bản chất của tầng lớp trí thức"],0],[132,"Đặc điểm của thời kỳ quá độ lên chủ nghĩa xã hội được thể hiện trên mấy lĩnh vực cơ bản?",["2 lĩnh vực","3 lĩnh vực","4 lĩnh vực","5 lĩnh vực"],2],[133,"Chọn từ thích hợp điền vào chỗ trống để hoàn thành câu sau: “Dân chủ là một..............., một chế độ xã hội “.",["thiết chế chính trị","thiết chế đặc thù","thể chế chính trị - xã hội","thể chế chính trị"],3],[134,"Theo quan điểm của chủ nghĩa Mác - Lênin, tiền đề kinh tế - xã hội dẫn tới sự sụp đổ không tránh khỏi của chủ nghĩa tư bản là:",["Sự lớn mạnh của lực lượng sản xuất và sự trưởng thành của giai cấp công nhân","Sự phát triển về lực lượng sản xuất và sự trưởng thành của giai cấp công nhân","Sự phát triển về lực lượng sản xuất và sự phát triển của giai cấp công nhân","Sự lớn mạnh của lực lượng sản xuất và sự lớn mạnh của giai cấp công nhân"],1],[135,"Tìm từ còn thiếu điền vào chỗ trống: “Nhà nước xã hội chủ nghĩa vừa có bản chất............., vừa có tính nhân dân rộng rãi và tính ........ sâu sắc”.",["giai cấp công nhân....giai cấp","giai cấp vô sản.... nhân đạo","giai cấp công nhân....dân tộc","giai cấp vô sản....cộng đồng"],2],[136,"Hồ Chí Minh lý giải: Việt Nam “tiến thẳng lên chủ nghĩa xã hội từ một nước nông nghiệp lạc hậu, không phải kinh qua giai đoạn phát triển tư bản chủ nghĩa” có nghĩa là:",["Bỏ qua lực lượng sản xuất của tư bản chủ nghĩa","Bỏ qua tư liệu sản xuất của tư bản chủ nghĩa","Bỏ qua quan hệ sản xuất của tư bản chủ nghĩa","Bỏ qua phương thức sản xuất tư bản chủ nghĩa"],2],[137,"Hãy hoàn thiện câu sau: “dân chủ xã hội chủ nghĩa và ........ về chính trị, bảo đảm vai trò lãnh đạo ......... của Đảng Cộng sản không loại trừ nhau mà ngược lại, chính sự lãnh đạo của Đảng là điều kiện cho dân chủ xã hội chủ nghĩa ra đời, tồn tại và phát triển”.",["nhất nguyên....duy nhất","đa nguyên....cao nhất","nhất nguyên....lớn nhất","nhất nguyên....quan trọng nhất"],0],[138,"Cơ sở kinh tế vững chắc cho xây dựng dân chủ xã hội chủ nghĩa là:",["Xây dựng, hoàn thiện thể chế kinh tế hàng hóa định hướng xã hội chủ nghĩa","Xây dựng, hoàn thiện thể chế kinh tế thị trường xã hội chủ nghĩa","Xây dựng, hoàn thiện thể chế kinh tế thị trường định hướng xã hội chủ nghĩa","Xây dựng, phát triển thể chế kinh tế thị trường định hướng chủ nghĩa xã hội"],2],[139,"Quan điểm của Đảng ta về những đặc trưng cơ bản của chủ nghĩa xã hội lần đầu tiên được thông qua tại:",["Đại hội VI","Đại hội VII","Đại hội VIII","Đại hội IX"],1],[140,"Trong thời kỳ quá độ lên chủ nghĩa xã hội, yếu tố đã và đang từng bước thúc đẩy tăng cường khối liên minh giữa giai cấp công nhân với giai cấp nông dân, đội ngũ trí thức và các tầng lớp xã hội khác là:",["Những biến đổi trong cơ cấu kinh tế","Những biến đổi trong cơ cấu nghề nghiệp","Những biến đổi trong cơ cấu giai cấp","Những biến đổi trong cơ cấu dân cư"],0],[141,"Theo quan điểm của chủ nghĩa Mác - Lênin, về phương diện quyền lực dân chủ là:",["Quyền lực thuộc về nhân dân, nhân dân là chủ nhân của nhà nước","Quyền hành thuộc về nhân dân, nhân dân là chủ nhân của nhà nước","Quyền bính thuộc về nhân dân, nhân dân là chủ nhân của nhà nước","Quyền lực thuộc về nhân dân lao động, nhân dân lao động là chủ nhân của nhà nước"],0],[142,"Hàng ngũ chức sắc các tôn giáo có vai trò, vị trí như thế nào trong Giáo hội?",["Quan trọng","Đặc biệt","To lớn","Rất quan trọng"],0],[143,"Cơ sở kinh tế - xã hội để xây dựng gia đình trong thời kỳ quá độ lên chủ nghĩa xã hội là :",["Xóa bỏ chế độ tư hữu, xác lập chế độ công hữu về tư liệu sản xuất","Phát triển kinh tế - xã hội","Nhà nước xã hội chủ nghĩa ban hành và thực hiện luật Hôn nhân và nâng cao trình độ văn hóa và dân trí cho mọi người dân","Tất cả các đáp án đều sai"],0],[144,"Quan hệ dân tộc và tôn giáo ở Việt Nam chịu sự chi phối mạnh mẽ bởi:",["Thói quen","Tín ngưỡng truyền thống","Biến đổi của lịch sử","Tất cả các đáp án đều sai"],1],[145,"Theo quan điểm của chủ nghĩa Mác - Lênin, tôn trọng tự do, tín ngưỡng cũng chính là:",["Tôn trọng quyền công dân, thể hiện bản chất ưu việt của chế độ xã hội chủ nghĩa","Tôn trọng quyền trẻ em, thể hiện bản chất ưu việt của chế độ xã hội chủ nghĩa","Tôn trọng quyền bình đẳng giới, thể hiện bản chất ưu việt của chế độ xã hội chủ nghĩa","Tôn trọng quyền con người, thể hiện bản chất ưu việt của chế độ xã hội chủ nghĩa"],3]]},{"s":146,"e":169,"q":[[146,"Hãy điền vào chỗ trống để hoàn thành câu sau: “các dân tộc Việt Nam có truyền thống ............ gắn bó lâu đời trong cộng đồng …........\".",["yêu nước.....dân tộc – tộc người","đoàn kết......dân tộc – quốc gia","gắn kết cộng đồng.....dân tộc – tộc người","đấu tranh anh dũng.....quốc gia"],1],[147,"Hãy điền vào chỗ trống trong câu sau: “Hai xu hướng khách quan của sự phát triển dân tộc có.….......... với nhau trong tiến trình phát triển của mỗi quốc gia và của toàn nhân loại”.",["sự thống nhất biện chứng","mối quan hệ mật thiết","mối quan hệ tác động qua lại","sự thống nhất tuyệt đối"],2],[148,". Chọn từ thích hợp điền vào chỗ trống trong câu sau: “Các ......... trong từng quốc gia, thậm chí các dân tộc ở nhiều quốc gia muốn.........với nhau”.",["dân tộc.....tách ra","tộc người....nhập vào","dân tộc...liên hiệp lại","Tất cả đáp án đều sai"],2],[149,"Chọn từ thích hợp điền vào chỗ trống trong câu sau : “ Tăng cường công tác...........đối với các tôn giáo và đấu tranh với hoạt động............gây thương hại đến lợi ích Tổ quốc và dân tộc “.",["quản lý nhà nước......đội lốt tôn giáo","quản lý......chia rẽ tôn giáo","kiểm soát nhà nước.....kích động tôn giáo","quản lý nhà nước.......lợi dụng tôn giáo"],3],[150,"Chọn từ thích hợp điền vào chỗ trống trong câu sau : “ Gia đình là một.......cộng đồng xã hội..........”.",["hình thái......quan trọng","hình thức.....đặc biệt","dạng thức......đặc thù","hình thể......đặc trưng"],1],[151,"Tiền đề tư tưởng lý luận cho sự ra đời của chủ nghĩa xã hội khoa học là :",["Triết học cổ điển Đức","Kinh tế chính trị học cổ điển Anh","Chủ nghĩa xã hội không tưởng phê phán","Triết học cổ điển Đức; Kinh tế chính trị học cổ điển Anh; Chủ nghĩa xã hội không tưởng phê phán"],3],[152,"Ba phát kiến vĩ đại của C.Mác và Ph.Ăngghen là :",["Chủ nghĩa duy vật biện chứng ; Học thuyết về giá trị thặng dư; Học thuyết về sứ mệnh lịch sử toàn thế giới của giai cấp công nhân","Chủ nghĩa duy vật lịch sử ; Học thuyết về giá trị thặng dư; Học thuyết về sứ mệnh lịch sử toàn thế giới của giai cấp công nhân","Học thuyết về giá trị thặng dư; Học thuyết về sứ mệnh lịch sử toàn thế giới của giai cấp công nhân ; Thời kỳ quá độ lên chủ nghĩa xã hội","Chủ nghĩa duy vật lịch sử ; Học thuyết về giá trị thặng dư; Quan điểm của chủ"],1],[153,"Công lao của V.L.Lênin là gì?",["Xây dựng chủ nghĩa xã hội trong thực tế, được đánh dấu bằng sự ra đời của Nhà nước vô sản đầu tiên trên thế giới - Nhà nước Xô Viết năm 1917","Xây dựng chủ nghĩa xã hội hiện thực, được đánh dấu bằng sự ra đời của Nhà nước xã hội chủ nghĩa đầu tiên trên thế giới - Nhà nước Xô Viết năm 1917","Xây dựng chủ nghĩa xã hội trong thực tiễn, được đánh dấu bằng sự ra đời của Nhà nước chuyên chính vô sản đầu tiên trên thế giới - Nhà nước Xô Viết năm 1917","Xây dựng chủ nghĩa xã hội trong thực tại, được đánh dấu bằng sự ra đời của Nhà nước dân chủ xã hội chủ nghĩa đầu tiên trên thế giới - Nhà nước Xô Viết năm 1917"],1],[154,"Hãy chọn đáp án đúng về ý nghĩa của chủ nghĩa xã hội khoa học:",["Chủ nghĩa xã hội khoa học góp phần quan trọng trong việc giáo dục niềm tin cách mạng cho nhân dân vào mục tiêu, lý tưởng xã hội chủ nghĩa và con đường đi lên chủ nghĩa xã hội","Chủ nghĩa xã hội khoa học góp phần quan trọng trong việc giáo dục niềm tin khoa học cho nhân dân vào mục tiêu, lý tưởng xã hội chủ nghĩa và con đường đi lên chủ nghĩa xã hội","Chủ nghĩa xã hội khoa học góp phần quan trọng trong việc giáo dục niềm tin lý tưởng cho nhân dân vào mục tiêu, lý tưởng xã hội chủ nghĩa và con đường đi lên chủ nghĩa xã hội","Chủ nghĩa xã hội khoa học góp phần quan trọng trong việc giáo dục niềm tin tất thắng cho nhân dân vào mục tiêu, lý tưởng xã hội chủ nghĩa và con đường đi lên chủ nghĩa xã hội"],1],[155,"Định nghĩa đúng nhất về giai cấp công nhân là gì?",["Là giai cấp bị áp bức bóc lột nặng nề nhất","Là giai cấp đông đảo trong dân cư và có khả năng cách mạng to lớn","Là giai cấp lao động trong nền sản xuất công nghiệp có trình độ kỹ thuật và công nghệ hiện đại","Là giai cấp ra đời gắn liền với nền sản xuất nông nghiệp của xã hội"],2],[156,"Xét về phương thức lao động, phương thức sản xuất, giai cấp công nhân mang thuộc tính cơ bản nào?",["Có số lượng đông nhất trong dân cư","Là giai cấp tạo ra của cải vật chất làm giàu cho xã hội","Là giai cấp trực tiếp hay gián tiếp vận hành máy móc có tính chất công nghiệp ngày càng hiện đại","Tất cả các đáp án đều sai"],2],[157,"Để thực hiện sứ mệnh lịch sử của giai cấp công nhân Việt Nam hiện nay cần phải:",["Xây dựng, phát triển giai cấp công nhân lớn mạnh, hiện đại","Xây dựng chỉnh đốn Đảng cầm quyền trong sạch, vững mạnh","Xây dựng Nhà nước của nhân dân, do nhân dân, vì nhân dân","Xây dựng, phát triển giai cấp công nhân lớn mạnh, hiện đại; Xây dựng chỉnh đốn Đảng cầm quyền trong sạch, vững mạnh"],3],[158,"Điền từ thích hợp vào chỗ trống: Tại hội nghị lần thứ VI của BCH Trung ương khóa X, Đảng ta đã xác định: “Giai cấp công nhân Việt Nam là một ........... to lớn, đang phát triển, bao gồm những người lao động chân tay và trí óc, làm công hưởng lương trong Các loại hình sản xuất kinh doanh và dịch vụ công nghiệp hoặc sản xuất, kinh doanh, dịch vụ có tính chất công nghiệp”.",["lực lượng chính trị","lực lượng xã hội","lực lượng chính trị, xã hội","lực lượng chính trị, kinh tế, xã hội"],1],[159,"Điền từ còn thiếu vào chỗ trống: Giai cấp công nhân là cơ sở ......... của Đảng, là nguồn bổ sung lực lượng của Đảng Cộng sản.",["chính trị - xã hội","giai cấp","xã hội - giai cấp","chính trị"],1],[160,"Chọn từ thích hợp điền vào chỗ trống để hoàn thành câu sau: “Độc lập dân tộc gắn liền với chủ nghĩa xã hội là..........của cách mạng Việt Nam, trong điều kiện thời đại ngày nay”.",["quy luật khách quan","quy luật","tất yếu lịch sử","tất yếu"],1],[161,"Giai cấp công nhân Việt Nam ra đời:",["Cùng với sự ra đời của tư sản dân tộc","Trước sự ra đời của tư sản dân tộc","Sau sự ra đời của tư sản dân tộc","Sau cách mạng tháng Tám năm 1945"],1],[162,"Thực hiện sứ mệnh lịch sử của giai cấp công nhân trên thế giới hiện nay về nội dung kinh tế - xã hội là điều kiện để phát huy vai trò chủ thể của giai cấp công nhân trong cuộc đấu tranh vì:",["Dân sinh","Dân chủ","Tiến bộ xã hội và chủ nghĩa xã hội","Dân sinh, dân chủ, tiến bộ xã hội và chủ nghĩa xã hội"],3],[163,"Theo quan điểm của chủ nghĩa Mác - Lênin, điều kiện quyết định nhất cho sự xuất hiện hình thái kinh tế - xã hội cộng sản chủ nghĩa là:",["Sự phát triển mạnh của lực lượng sản xuất dưới chủ nghĩa tư bản","Mâu thuẫn giữa giai cấp công nhân với giai cấp tư sản trở nên gay gắt","Xây dựng được Đảng Cộng sản","Dưới sự lãnh đạo của Đảng Cộng sản, giai cấp công nhân lật đổ được giai cấp thống trị, giành được chính quyền"],0],[164,"Đặc điểm quá độ lên chủ nghĩa xã hội ở Việt Nam là:",["Bỏ qua chế độ tư bản chủ nghĩa","Không trải qua chế độ tư bản chủ nghĩa","Không kinh qua chế độ tư bản chủ nghĩa","Bỏ qua chế độ chủ nghĩa tư bản"],0],[165,"Chọn từ thích hợp điền vào chỗ trống làm rõ quan điểm của các nhà kinh điển của chủ nghĩa Mác - Lênin về Đảng Cộng sản: “ Đảng Cộng sản - .............của giai cấp công nhân ra đời và đảm nhận vai trò lãnh đạo cuộc cách mạng là dấu hiệu về sự trưởng thành vượt bậc của giai cấp công nhân với tư cách là giai cấp cách mạng”.",["đội tiên phong","đội tiền phong","lực lượng đi đầu","lực lượng hàng đầu"],0],[166,"Theo quan điểm của chủ nghĩa Mác - Lênin, một trong những đặc trưng cơ bản của chủ nghĩa xã hội là:",["Chủ nghĩa xã hội giải phóng dân tộc, giải phóng giai cấp, giải phóng xã hội, giải phóng con người, tạo điều kiện để con người phát triển toàn diện","Chủ nghĩa xã hội giải phóng xã hội, giải phóng con người, giải phóng dân tộc, giải phóng giai cấp, tạo điều kiện để con người phát triển toàn diện","Chủ nghĩa xã hội giải phóng giai cấp, giải phóng dân tộc, giải phóng xã hội, giải phóng con người, tạo điều kiện để con người phát triển toàn diện","Chủ nghĩa xã hội giải phóng con người, giải phóng dân tộc, giải phóng giai cấp, giải phóng xã hội, tạo điều kiện để con người phát triển toàn diện"],2],[167,"Trong thời kỳ quá độ lên chủ nghĩa xã hội ở nước ta hiện nay, thành phần kinh tế nào ngày càng trở thành nền tảng của nền kinh tế quốc dân ?",["Kinh tế nhà nước và kinh tế cá thể","Kinh tế nhà nước và kinh tế tập thể","Kinh tế nhà nước và kinh tế tư bàn tư nhân","Kinh tế nhà nước và kinh tế có vốn đầu tư trực tiếp nước ngoài"],1],[168,"Đặc trưng về phương diện kinh tế của chủ nghĩa xã hội là:",["Có nền kinh tế phát triển dựa trên lực lượng sản xuất hiện đại và chế sản xuất chủ yếu","Có nền kinh tế phát triển cao dựa trên lực lượng sản xuất hiện đại và chế độ công hữu về tư liệu sản xuất chủ yếu","Có nền kinh tế phát triển hiện đại dựa trên lực lượng sản xuất tiên tiến và chế độ công hữu về tư liệu sản xuất chủ yếu","Có nền kinh tế phát triển mạnh mẽ dựa trên lực lượng sản xuất hiện đại và chế độ công hữu về tư liệu sản xuất cơ bản"],1],[169,"Thực chất của thời kỳ quá độ lên chủ nghĩa xã hội của Việt Nam là:",["Thời kỳ cải tạo cách mạng từ xã hội tiền tư bản chủ nghĩa và tư bản chủ nghĩa sang xã hội xã hội chủ nghĩa","Thời kỳ cải cách cách mạng từ xã hội tiền tư bản chủ nghĩa và tư bản chủ nghĩa sang xã hội xã hội chủ nghĩa","Thời kỳ cải biến cách mạng từ xã hội tiền tư bản chủ nghĩa và tư bản chủ nghĩa sang xã hội xã hội chủ nghĩa","Thời kỳ cải tổ cách mạng từ xã hội tiền tư bản chủ nghĩa và tư bản chủ nghĩa sang xã hội xã hội chủ nghĩa"],2]]},{"s":170,"e":193,"q":[[170,"Đặc trưng về kinh tế của Việt Nam trong thời kỳ quá độ lên chủ nghĩa xã hội được Đảng ta xác định tại Đại hội Đảng toàn quốc lần thứ XI (năm 2011) là :” Có nền kinh tế............cao dựa trên lực lượng sản xuất hiện đại và quan hệ sản xuất...........phù hợp “.",["phát triển......tiến bộ","tăng trưởng.....tiên tiến","lớn mạnh.....hiện đại","vững mạnh......tiến bộ"],0],[171,"Tổ chức nào đóng vai trò trụ cột trong hệ thống chính trị ở nước ta hiện nay ?",["Đảng Cộng sản Việt Nam","Nhà nước xã hội chủ nghĩa","Mặt trận Tổ quốc","Các đoàn thể nhân dân"],1],[172,"Công tác tôn giáo là trách nhiệm của tổ chức nào ?",["Đảng Cộng sản","Hệ thống chính trị","Nhà nước xã hội chủ nghĩa","Mặt trận Tổ quốc"],2],[173,"Quan điểm của chủ nghĩa Mác – Lênin cho rằng, trong xã hội công xã nguyên thủy tín ngưỡng, tôn giáo chỉ biểu hiện thuần túy về :",["Tư tường","Tinh thần","Ý thức","Nhận thức"],0],[174,"Việt Nam là một quốc gia đa dân tộc, đa tôn giáo ; quan hệ dân tộc và tôn giáo được thiết lập và củng cố trên cơ sở :",["Cộng đồng quốc gia – dân tộc thống nhất","Cuộc đấu tranh giữa lực lượng sản xuất và quan hệ sản xuất","Cuộc đấu tranh giữa cơ sở hạ tầng và kiến trúc thượng tầng.","Tất cả đáp án đều đúng"],0],[175,"Một trong những nguyên tắc giải quyết vấn đề tôn giáo trong thời kỳ quá độ lên chủ nghĩa xã hội là :",["Phân biệt hai mặt chính trị và tư tưởng; tín ngưỡng, tôn giáo và lợi dụng tín ngưỡng, tôn giáo trong quá trình giải quyết vấn đề tôn giáo","Không phân biệt hai mặt chính trị và tư tưởng; tín ngưỡng, tôn giáo và lợi dụng tín ngưỡng, tôn giáo trong quá trình giải quyết vấn đề tôn giáo","Chỉ phân biệt mặt chính trị","Tất cả các đáp án đều sai"],0],[176,"Chọn từ thích hợp điền vào chỗ trống để hoàn thành câu sau : “Khắc phục dần những ảnh hưởng............của tôn giáo phải gắn liền với quá trình.............,xây dựng xã hội mới “.",["tích cực.....cải cách xã hội cũ","xấu.....cải biến xã hội cũ","tiêu cực....cải tạo xã hội cũ","Tất cả đáp án đều sai"],2],[177,"Chọn từ thích hợp điền vào chỗ trống để hoàn thành câu sau : “ Gia đình là...........,mang lại các giá trị............, sự hài hòa trong đời sống cá nhân của mỗi thành viên “.",["tế bào xã hội....vật chất","thiết chế xã hội.....tinh thần","tổ ấm.....hạnh phúc","đơn vị xã hội.....xã hội"],2],[178,"Tác phẩm kinh điển nào của C.Mác và Ăngghen đánh dấu sự ra đời của chủ nghĩa xã khoa học ?",["Tuyên ngôn của Đảng Cộng Sản","Bộ Tư bản","Đấu tranh giai cấp ở Pháp","Phê phán Cương lĩnh Gôta"],0],[179,"Mục tiêu cao nhất của việc giai cấp công nhân giành lấy quyền lực thống trị xã hội là :",["Giải phóng con người","Giải phóng xã hội","Mang lại quyền lợi cho giai cấp công nhân","Mang lại quyền lợi cho giai cấp công nhân và giai cấp nông dân"],0],[180,"Phương pháp nghiên cứu có tính đặc thù của chủ nghĩa xã hội là :",["Phương pháp kết hợp lịch sử và logic","Phương pháp so sánh","Các phương pháp có tính liên ngành","Phương pháp khảo sát và phân tích về mặt chính trị - xã hội dựa trên các điều kiện kinh tế - xã hội cụ thể"],3],[181,"Đặc trưng nào là đặc trưng bản chất của giai cấp công nhân ?",["Lao động trong nền sản xuất công nghiệp hiện đại, đại biểu cho phương thức sản xuất tiên tiến của thời đại","Là lực lượng lao động đông đảo trong xã hội","Đại biểu cho trí tuệ của nhân loại","Là giai cấp không có tư liệu sản xuất nên phải bán sức lao động cho nhà tư bản."],0],[182,"Trong thời kỳ quá độ lên chủ nghĩa xã hội, hình thành liên minh giữa giai cấp công nhân với giai cấp nông dân và tầng lớp trí thức là do :",["Do mong muốn của công nhân","Yêu cầu của nông dân","Yêu cầu của trí thức","Do đòi hỏi khách quan của cả công nhân, nông dân và trí thức"],3],[183,"Một trong những phương hướng xây dựng đất nước ta mà Đại hội Đảng toàn quốc lần thứ XI nêu ra là :",["Phát triển nền kinh tế hàng hóa định hướng xã hội chủ nghĩa","Phát triển nền kinh tế tri thức định hướng xã hội chủ nghĩa","Phát triển nền kinh tế thị trường định hướng xã hội chủ nghĩa","Phát triển nền kinh tế số định hướng xã hội chủ nghĩa"],2],[184,"Hãy chọn phương án đúng để hoàn thiện câu sau về học thuyết hình thái kinh tế - xã hội: “ Học thuyết vạch rõ những.............. của vận động xã hội, chỉ ra phương pháp khoa học để giải thích lịch sử “.",["quy luật cơ bản","quy luật quan trọng","quy luật tất yếu","quy luật chính trị"],0],[185,"Theo quan điểm của chủ nghĩa Mác - Lênin, hai lĩnh vực quan trọng hàng đầu và nổi bật nhất là dân chủ trong lĩnh vực nào ?",["Dân chủ trong kinh tế và dân chủ trong chính trị","Dân chủ trong kinh tế và dân chủ trong xã hội","Dân chủ trong kinh tế và dân chủ trong văn hóa","Dân chủ trong kinh tế và dân chủ trong chính trị - xã hội"],0],[186,"Nhà nước pháp quyền được hiểu là nhà nước mà ở đó:",["Tất cả mọi công dân đều được giáo dục pháp luật và phải được hiểu biết pháp luật, tuân thủ pháp luật, pháp luật phải đảm bảo tính nghiêm minh","Trong hoạt động của các cơ quan nhà nước, phải có sự kiểm soát lẫn nhau, tất cả vì mục tiêu phục vụ nhân dân","Các cơ quan của nhà nước được phân quyền rõ ràng và được mọi người chấp nhận trên nguyên tắc bình đẳng của các thế lực, giai cấp và tầng lớp trong xã hội","Tất cả mọi công dân đều được giáo dục pháp luật và phải được hiểu biết pháp luật, tuân thủ pháp luật, pháp luật phải đảm bảo tính nghiêm minh; Trong hoạt động của các cơ quan nhà nước,phải có sự kiểm soát lẫn nhau, tất cả vì mục tiêu phục vụ nhân dân"],3],[187,"Hãy hoàn thiện câu sau: “Về văn hóa, xã hội, nhà nước xã hội chủ nghĩa được xây dựng trên nền tảng tinh thần là lý luận của chủ nghĩa Mác - Lênin và những.............tiên tiến, tiến bộ của nhân loại, đồng thời mang những bản sắc riêng của dân tộc “.",["giá trị văn hóa","tư tưởng văn hóa","tinh hoa văn hóa","thành tựu văn hóa"],0],[188,"Nhà nước xã hội chủ nghĩa ra đời do:",["Khát vọng về một xã hội công bằng, dân chủ, bình đẳng và bác ái","Nguyện vọng của nhân dân lao động muốn thoát khỏi sự áp bức, bất công","Kết quả của cuộc cách mạng do giai cấp vô sản và nhân dân lao động tiến hành dưới sự lãnh đạo của Đảng Cộng sản","Ước mơ xây dựng một xã hội dân chủ, công bằng"],2],[189,"Sự biến đổi phức tạp, đa dạng của cơ cấu xã hội - giai cấp dẫn đến xuất hiện điều gì?",["Các giai cấp mới","Tầng lớp mới","Tầng lớp xã hội mới","Các nhóm xã hội mới"],2],[190,"Hiện nay, ở Việt Nam đội ngũ doanh nhân phát triển như thế nào?",["Phát triển mạnh mẽ về số lượng, chất lượng với vai trò không ngừng tăng lên","Phát triển nhanh về số lượng và quy mô với vai trò không ngừng tăng lên","Phát triển mạnh về đội ngũ và chất lượng với vai trò không ngừng tăng lên","Phát triển thần tốc về số lượng với vai trò không ngừng tăng lên"],1],[191,"Cần có quan điểm lịch sử cụ thể trong giải quyết vấn đề tín ngưỡng, tôn giáo thuộc một trong những:",["Tính chất tôn giáo","Nguyên tắc giải quyết vấn đề tôn giáo trong thời kỳ quá độ lên chủ nghĩa xã hội","Nguồn gốc tôn giáo","Tất cả các đáp án đều sai"],1],[192,"Chọn từ thích hợp điền vào chỗ trống trong câu sau: “Sự biến đổi...............tất yếu sẽ ảnh hưởng đến sự biến đổi của các cơ cẩu xã hội khác và tác động đến sự biến đổi của toàn bộ cơ cấu xã hội”.",["cơ cấu xã hội giai cấp","cơ cấu xã hội nghề nghiệp","cơ cấu xã hội - kinh tế","cơ cấu xã hội - dân tộc"],0],[193,"Hãy điền vào chỗ trống để hoàn thành câu sau của V.LLênin: “Nguyên tắc cao nhất của chuyên chính là duy trì khối ......... giữa giai cấp vô sản và nông dân để giai cấp vô sản có thể giữ được vai trò lãnh đạo và chính quyền nhà nước\".",["liên kết","đoàn kết","hợp tác","liên minh"],3]]},{"s":194,"e":217,"q":[[194,"Hãy điền vào chỗ trống: “Giai cấp nông dân cùng với nông nghiệp, nông thôn có vị chiến lược trong sự nghiệp..................nông nghiệp, nông thôn gắn với xây dựng nông trong sự nghiệp thôn mới, góp phần xây dựng và bảo vệ Tổ quốc”.",["đổi mới","phát triển","xây dựng","công nghiệp hóa, hiện đại hóa"],3],[195,"Cơ sở xây dựng gia đình trong thời kỳ quá độ lên chủ nghĩa xã hội là:",["Cơ sở kinh tế - xã hội","Cơ sở chính trị - xã hội","Cơ sở văn hóa và hôn nhân tự nguyện","Tất cả các đáp án đều đúng"],3],[196,"Một trong những khu vực trọng điểm các thế lực thù địch thường xuyên lợi dụng vấn đề dân tộc và vấn đề tôn giáo nhằm thực hiện “diễn biến hòa bình” là:",["Tây Nam Bộ","Bắc Trung Bộ","Tây Nguyên","Không có đáp án đúng"],2],[197,"Cơ sở chính trị - xã hội để xây dựng giai đình trong thời kỳ quá độ lên chủ nghĩa xã hội là:",["Việc xây dựng chính quyền nhà nước của giai cấp công nhân và nhân dân lao động, nhà nước xã hội chủ nghĩa","Việc thiết lập chính quyền nhà nước của giai cấp công nhân và nhân dân lao động, nhà nước xã hội chủ nghĩa","Việc củng cố chính quyền nhà nước của giai cấp công nhân và nhân dân lao động, nhà nước xã hội chủ nghĩa","Việc hình thành chính quyền nhà nước của giai cấp công nhân và nhân dân lao động, nhà nước xã hội chủ nghĩa"],1],[198,"Những quan hệ cơ bản nhất trong gia đình là:",["Quan hệ hôn nhân","Quan hệ hôn nhân và huyết thống","Quan hệ quần tụ trong một không gian sinh tồn","Quan hệ nuôi dưỡng"],1],[199,"Nội dung cốt lõi của công tác tôn giáo là:",["Vận động quần chúng","Vận động nhân dân","Vận động đồng bào","Vận động các giai cấp, tầng lớp"],0],[200,"Hãy điền vào chỗ trống để hoàn thiện câu sau để làm rõ nội dung của cơ sở xây dựng gia đình trong thời kỳ quá độ lên chủ nghĩa xã hội : “ Cơ sở kinh tế - xã hội để.........gia đình trong thời kỳ quá độ lên chủ nghĩa xã hội là sự phát triển của...........”.",["xây dựng.....lực lượng sản xuất","phát triển.....nguồn nhân lực","củng cố.....quan hệ sản xuất","ổn định.....người lao động"],0],[201,"Câu nói : “ Thực hiện sự nghiệp giải phóng thế giới ấy – đó là sứ mệnh lịch sử của giai cấp vô sản hiện đại “ là của ai ?",["C.Mác","Ph. Ăngghen","Lênin","Hồ Chí Minh"],1],[202,"Giai cấp công nhân Việt Nam hiện nay có những biến đổi chủ yếu nào sau đây ?",["Cơ cấu xã hội – nghề nghiệp","Trình độ học vấn và tay nghề bậc thợ","Đời sống, tâm lý, ý thức, đội tiên phong của giai cấp công nhân là Đảng Cộng sản","Cơ cấu xã hội – nghề nghiệp; Trình độ học vấn và tay nghề bậc thợ; Đời sống, tâm lý, ý thức, đội tiên phong của giai cấp công nhân là Đảng Cộng sản"],3],[203,"Sự thay đổi căn bản, toàn diện và triệt để một hình thái kinh tế - xã hội này bằng một hình thái kinh tế - xã hội khác là :",["Cách mạng xã hội","Đột biến xã hội","Cải cách xã hội","Tiến bộ xã hội"],3],[204,"Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội được Đảng ta nêu ra ở Đại hội nào ?",["Đại hội V","Đại hội VI","Đại hội VII","Đại hội VIII"],2],[205,"Chọn từ thích hợp điền vào chỗ trống trong câu sau : “ Đặc điểm cơ bản của thời kỳ quá độ lên chủ nghĩa xã hội là thời kỳ.............sâu sắc, triệt để xã hội tư bản chủ nghĩa trên tất cả các lĩnh vực, kinh tế, chính trị, văn hóa, xã hội, xây dựng từng bước cơ sở vật chất – kỹ thuật và đời sống tinh thần của............”.",["cải biến cách mạng......chủ nghĩa xã hội","cải tổ xã hội......xã hội chủ nghĩa","cải cách xã hội......xã hội chủ nghĩa","cải tạo cách mạng.......chủ nghĩa xã hội"],3],[206,"Bản chất kinh tế của nhà nước xã hội chủ nghĩa là :",["Chế độ sở hữu riêng về tư liệu sản xuất","Chế độ sở hữu chung về tư liệu sản xuất","Chế độ sở hữu xã hội về tư liệu sản xuất","Chế độ sở hữu nhà nước về tư liệu sản xuất"],2],[207,"Bản chất tư tưởng văn hóa – xã hội của nền dân chủ xã hội chủ nghĩa là :",["Nền dân chủ xã hội chủ nghĩa lấy chủ nghĩa Mác – Lênin – hệ tư tưởng của giai cấp công nhân, làm chủ đạo đối với mọi hình thái ý thức xã hội khác trong xã hội mới","Nền dân chủ xã hội chủ nghĩa lấy hệ tư tưởng Mác - Lênin - hệ tư tưởng của giai cấp vô sản, làm chủ đạo đối với mọi hình thái ý thức xã hội khác trong xã hội mới","Nền dân chủ xã hội chủ nghĩa lấy chủ nghĩa Mác - Lênin - hệ tư tưởng của giai cấp vô sản, làm chủ đạo đối với mọi hình thái ý thức xã hội khác trong xã hội mới","Nền dân chủ xã hội chủ nghĩa lấy hệ tư tưởng Mác - Lênin - hệ tư tưởng của giai cấp công nhân, làm chủ đạo đối với mọi hình thái ý thức xã hội khác trong xã hội mới"],3],[208,"Điều kiện tiên quyết để xây dựng nền dân chủ xã hội chủ nghĩa Việt Nam là:",["Xây dựng Đảng cầm quyền trong sạch, vững mạnh","Xây dựng Nhà nước pháp quyền xã hội chủ nghĩa","Xây dựng Đảng Cộng sản Việt Nam trong sạch, vững mạnh","Xây dựng Nhà nước của nhân dân, do nhân dân, vì nhân dân"],2],[209,"Hãy điền vào chỗ trống để làm rõ quan niệm chung về nhà nước pháp quyền xã hội chủ nghĩa ở Việt Nam: “ nhà nước pháp quyền là nhà nước ......... pháp luật, nhà nước hướng tới những vấn đề về phúc lợi cho mọi người, tạo điều kiện cho cá nhân được tự do, bình đẳng, phát huy hết năng lực của chính mình “.",["thượng tôn","đề cao","tôn vinh","đề xuất"],0],[210,"Có mấy phương hướng cơ bản để xây dựng cơ cấu xã hội - giai cấp và tăng cường liên minh giai cấp, tầng lớp trong thời kỳ quá độ lên chủ nghĩa xã hội ở Việt Nam?",["4 phương hướng","5 phương hướng","6 phương hướng","7 phương hướng"],0],[211,"Trong thời kỳ quá độ lên chủ nghĩa xã hội, giai cấp công nhân có vai trò như thế nào trong cơ cấu xã hội - giai cấp ?",["chủ đạo, tiên phong","chủ đạo, đi đầu","chủ đạo, định hướng","chủ đạo, dẫn đường"],1],[212,"Ở nước ta, nội dung chính trị của liên minh thể hiện:",["Thể hiện ở việc giữ vững quan điểm chính trị - tư tưởng của giai cấp công nhân, đồng thời giữ vững vai trò lãnh đạo của Đảng Cộng sản Việt Nam đối với khối liên minh và đối với toàn xã hội...","Thể hiện ở việc giữ vững tư tưởng chính trị - tư tưởng của giai cấp công nhân, đồng thời giữ vững vai trò lãnh đạo của Đảng Cộng sản Việt Nam đối với khối liên minh và đối với toàn xã hội...","Thể hiện ở việc giữ vững hệ tư tưởng chính trị - tư tưởng của giai cấp công nhân, đồng thời giữ vững vai trò lãnh đạo của Đảng Cộng sản Việt Nam đối với khối liên minh và đối với toàn xã hội...","Thể hiện ở việc giữ vững lập trường chính trị - tư tưởng của giai cấp công nhân, đồng thời giữ vững vai trò lãnh đạo của Đảng Cộng sản Việt Nam đối với khối liên minh và đối với toàn xã hội..."],3],[213,"Nội dung nào trong Cương lĩnh dân tộc của chủ nghĩa Mác – Lênin vừa là nội dung chủ yếu, vừa là giải pháp quan trọng để liên kết các nội dung của Cương lĩnh dân tộc thành một chỉnh thể ?",["Các dân tộc hoàn toàn bình đẳng","Các dân tộc được quyền tự quyết","Liên hiệp công nhân tất cả các dân tộc","Tất cả các đáp án đều sai"],2],[214,"Mỗi dân tộc ở Việt Nam có điểm gì riêng ?",["Phong tục tập quán","Đời sống tinh thần","Văn hóa đời sống","Bản sắc văn hóa"],3],[215,"Tiền đề khoa học tự nhiên có tính cách mạng cho sự ra đời của chủ nghĩa xã hội khoa học là :",["Học thuyết tiến hóa","Định luật bảo toàn và chuyển hóa năng lượng","Học thuyết tiến hóa; Định luật bảo toàn và chuyển hóa năng lượng; Học thuyết tế bào","Học thuyết tế bào"],2],[216,"Xét trong quan hệ sản xuất tư bản chủ nghĩa, giai cấp công nhân có vị trí như thế nào ?",["Là giai cấp có số lượng đông trong dân cư, luôn đi đầu trong cuộc đấu tranh chống giai cấp tư sản","Là giai cấp nghèo khổ nhất, không có tài sản","Là giai cấp không có tư liệu sản xuất, đi làm thuê cho nhà tư bản, bị nhà tư bản bóc lột giá trị thặng dư","Là giai cấp có số lượng đông trong dân cư đi làm thuê cho nhà tư bản"],2],[217,"Nội dung sứ mệnh lịch sử của giai cấp công nhân là:",["Lãnh đạo và tổ chức nhân dân lao động xóa bỏ chế độ tư bản chủ nghĩa","Xoá bỏ mọi chế độ áp bức, bóc lột và xây dựng xã hội mới - xã hội tư bản chủ nghĩa","Lãnh đạo và tổ chức nhân dân lao động xóa bỏ các chế độ người bóc lột người, xóa bỏ chủ nghĩa tư bản, giải phóng giai cấp công nhân, nhân dân lao động khỏi mọi sự áp bức, bóc lột, nghèo nàn, lạc hậu, xây dựng xã hội cộng sản chủ nghĩa văn minh","Xây dựng xã hội xã hội chủ nghĩa, không có người bóc lột người trên cơ sở công hữu về tư liệu sản xuất chủ yếu"],2]]},{"s":218,"e":241,"q":[[218,"Đại hội Đảng Cộng sản đề ra đường lối đổi mới toàn diện đất nước, trong đó nhấn mạnh phát huy dân chủ để tạo ra một động lực mạnh mẽ cho phát triển đất nước là :",["Đại hội VI","Đại hội VII","Đại hội VIII","Đại hội IX"],0],[219,"Hãy chọn đáp án đúng: Với chức năng chính trị, gia đình là:",["Một tổ chức chính trị của xã hội, là nơi tổ chức thực hiện chính sách, pháp luật của nhà nước và quy chế (hương ước) của làng, xã và hưởng lợi từ hệ thống pháp luật, chính sách và quy chế đó","Một cơ sở chính trị của xã hội, là nơi tổ chức thực hiện chính sách, pháp luật của nhà nước và quy chế (hương ước) của làng, xã và hưởng lợi từ hệ thống pháp luật chính sách và quy chế đó","Một thiết chế chính trị của xã hội, là nơi tổ chức thực hiện chính sách, pháp luật của nhà nước và quy chế (hương ước) của làng, xã và hưởng lợi từ hệ thống pháp luật, chính sách và quy chế đó","Một cộng đồng chính trị của xã hội, là nơi tổ chức thực hiện chính sách, pháp luật của nhà nước và quy chế (hương ước) của làng, xã và hưởng lợi từ hệ thống pháp luật, chính sách và quy chế đó"],0],[220,"Theo quan điểm của chủ nghĩa Mác - Lênin, gia đình là:",["Là một hình thức cộng đồng xã hội đặc biệt","Cùng với những quy định về về quyền và nghĩa vụ của các thành viên trong gia đình","Được hình thành, duy trì và củng cố chủ yếu dựa trên cơ sở hôn nhân, quan hệ huyết thống và quan hệ nuôi dưỡng","Tất cả các đáp án đều đúng"],3],[221,"Hãy điền vào chỗ trống: “ nhà nước xã hội chủ nghĩa là một kiểu nhà nước mà ở đó, sự thống trị thuộc về .................,do cách mạng xã hội chủ nghĩa sản sinh ra và có sứ mệnh xây dựng thành công chủ nghĩa xã hội, đưa nhân dân lao động lên địa vị làm chủ trên tất cả các
