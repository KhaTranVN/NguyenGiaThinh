 mặt của đời sống xã hội trong một xã hội phát triển cao - xã hội xã hội chủ nghĩa”.",["giai cấp vô sản hiện đại.","giai cấp công nhân","giai cấp vô sản","giai cấp công nhân hiện đại"],1],[222,"Nội dung cơ bản và trực tiếp để xây dựng gia đình ở Việt Nam hiện nay là :",["Nâng cao trình độ dân trí cho nhân dân lao động","Phát triển kinh tế - xã hưe/ội","Xây dựng gia đình no ấm, bình đẳng, tiến bộ và hạnh phúc","Giải phóng người phụ nữ"],2],[223,"Trong công cuộc đổi mới đất theo định hướng xã hội chủ nghĩa, khi nhấn mạnh phát huy dân chủ để tạo ra một động lực mạnh mẽ cho sự phát triển đất nước, Đảng ta đã khẳng định điều gì?",["Trong toàn bộ hoạt động của mình, Đảng phải quán triệt tư tưởng “lấy dân làm gốc”, xây dựng và phát huy quyền làm chủ của nhân dân lao động","Trong toàn bộ hoạt động của mình, Đảng phải quán triệt tư tưởng “lấy dân làm nòng cốt”, xây dựng và phát triển quyền làm chủ của nhân dân lao động","Trong toàn bộ hoạt động của mình, Đảng phải quán triệt tư tưởng “lấy dân làm cơ sở”, xây dựng và phát huy quyền làm chủ của nhân dân lao động","Trong toàn bộ hoạt động của mình, Đảng phải quán triệt tư tưởng “lấy dân làm nền tảng”, xây dựng và phát huy quyền làm chủ của nhân dân lao động"],0],[224,"Biện pháp ngăn chặn những cá nhân lợi dụng quyền tự do kết hôn, tự do ly hôn để thỏa mãn những nhu cầu không chính đảng, để bảo vệ hạnh phúc của cá nhân và gia đình là :",["Thực hiện thủ tục luật pháp trong hôn nhân là thể hiện sự tôn trọng trong tình yêu, trách nhiệm giữa nam và nữ, trách nhiệm của cá nhân với gia đình và xã hội và ngược lại","Thực hiện thủ tục pháp luật trong hôn nhân là thể hiện sự trân trọng trong tình yêu, trách nhiệm giữa nam và nữ, trách nhiệm của cá nhân với gia đình và xã hội và ngược lại","Thực hiện thủ tục pháp lý trong hôn nhân là thể hiện sự tôn trọng trong tình yêu, trách nhiệm giữa nam và nữ, trách nhiệm của cá nhân với gia đình và xã hội và ngược lại","Thực hiện thủ tục hành chính trong hôn nhân là thể hiện sự đề cao tình yêu, trách nhiệm giữa nam và nữ, trách nhiệm của cá nhân với gia đình và xã hội và ngược lại"],2],[225,"Ở thời kỳ quá độ lên chủ nghĩa xã hội, trong cơ cấu xã hội - giai cấp, giai cấp nào là lực lượng tiêu biểu cho phương thức sản xuất mới giữ vai trò chủ đạo, tiên phong trong quá trình công nghiệp hóa, hiện đại hóa đất nước, cải tạo xã hội cũ, xây dựng xã hội mới?",["Giai cấp công nhân","Giai cấp vô sản","Giai cấp nông dân","Tất cả các đáp án đều sai"],0],[226,"Có bao nhiêu nguyên tắc giải quyết vấn đề tôn giáo trong thời kỳ quá độ lên chủ nghĩa xã hội ?",["3 nguyên tắc","4 nguyên tắc","5 nguyên tắc","6 nguyên tắc"],1],[227,"Đặc trưng về văn hóa - tinh thần của chủ nghĩa xã hội là :",["Có nền văn hóa hiện đại, kế thừa và phát huy những giá trị văn hóa dân tộc và tinh hoa văn hóa nhân loại","Có nền văn hóa phát triển, kế thừa và phát huy những tinh hoa văn hóa dân tộc và tinh hoa văn hóa nhân loại","Có nền văn hóa tiên tiến, kế thừa và phát huy những giá trị văn hóa dân tộc và tinh hoa văn hóa nhân loại","Có nền văn hóa phát triển cao, kế thừa và phát huy những giá trị văn hóa dân tộc và tinh hoa văn hóa nhân loại"],3],[228,"Chọn từ thích hợp điền vào chỗ trống trong câu sau để làm rõ quan điểm của V.I.Lênin : “ Người ta chỉ có thể trở thành người...........khi biết làm giàu trí óc của mình bằng sự hiểu biết tất cả những kho tàng tri thức mà nhân loại đã tạo ra “.",["cán bộ","cách mạng","cộng sản","lãnh đạo"],2],[229,"V.I.Lênin vận dụng và phát triển chủ nghĩa xã hội khoa học trong điều kiện mới ở thời kỳ nào?",["Thời kỳ trước cách mạng Tháng Mười Nga","Thời kỳ từ sau Cách mạng Tháng 10 Nga (1917) đến năm 1924","Thời kỳ từ sau Cách mạng Tháng 10 Nga (1917) đến năm 1921","Thời kỳ trước cách mạng Tháng Mười Nga; Thời kỳ từ sau cách mạng Tháng Mười Nga (1917) đến năm 1924"],3],[230,"Những nội dung cơ bản về chủ nghĩa xã hội trong môn chủ nghĩa xã hội khoa học gồm:",["Điều kiện ra đời chủ nghĩa xã hội","Những đặc trưng bản chất của chủ nghĩa xã hội","Chủ nghĩa xã hội giai đoạn đầu của hình thái kinh tế - xã hội cộng sản chủ nghĩa","Tất cả các đáp án đều đúng"],3],[231,"V.I.Lênin đã coi chuyên chính vô sản là gì trong liên minh giai cấp giữa giai cấp vô sản, đội tiền phong của những người lao động, với đông đảo những tầng lớp lao động không phải vô sản?",["Mối liên hệ đặc biệt","Hình thái đặc biệt","Trạng thái đặc biệt","Hình thức đặc biệt"],3],[232,"Chủ nghĩa Mác - Lênin có quan điểm như thế nào về bản chất của tôn giáo ?",["Tôn giáo là một hiện tượng tự nhiên","Tôn giáo là một hiện tượng xã hội - văn hoá do con người sáng tạo ra","Tất cả các đáp án đều sai","Tôn giáo do tự nhiên tạo ra"],1],[233,"Theo các nhà kinh điển của chủ nghĩa Mác – Lênnin, giai cấp công nhân có mấy đặc điểm chủ yếu ?",["3 đặc điểm","4 đặc điểm","5 đặc điểm","6 đặc điểm"],1],[234,"Điều kiện chính trị - xã hội để dẫn đến sự ra đời của chủ nghĩa xã hội là:",["Mâu thuẫn giữa tính chất xã hội hóa của công cụ sản xuất với chế độ chiếm hữu tư nhân tư bản chủ nghĩa đối với tư liệu sản xuất trở thành mâu thuẫn kinh tế cơ bản của chủ nghĩa tư bản, biểu hiện về mặt xã hội là mâu thuẫn giữa giai cấp công nhân hiện đại với giai cấp tư sản lỗi thời","Mâu thuẫn giữa tính chất xã hội hóa của lực lượng sản xuất với chế độ chiếm hữu tư nhân tư bản chủ nghĩa đối với tư liệu sản xuất trở thành mâu thuẫn cơ bản của chủ nghĩa tư bản, biểu hiện về mặt xã hội là mâu thuẫn giữa giai cấp công nhân hiện đại với giai cấp tư sản lỗi thời","Mâu thuẫn giữa tính chất xã hội hóa của lực lượng sản xuất với chế độ chiếm hữu tư nhân tư bản chủ nghĩa đối với tư liệu sản xuất trở thành mâu thuẫn kinh tế cơ bản của chủ nghĩa tư bản, biểu hiện về mặt xã hội là mâu thuẫn giữa giai cấp công nhân hiện đại với giai cấp tư sản","Mâu thuẫn giữa tính chất xã hội hóa của lực lượng sản xuất với chế độ chiếm hữu tư bản chủ nghĩa đối với tư liệu sản xuất trở thành mâu thuẫn kinh tế cơ bản của tư bản chủ nghĩa, biểu hiện về mặt xã hội là mâu thuẫn giữa giai cấp công nhân hiện đại với giai cấp tư sản lỗi thời"],3],[235,"Nội dung : Tôn giáo ở Việt Nam đa dạng, đan xen, chung sống hòa bình và không có xung đột, chiến tranh tôn giáo là một trong những :",["Đặc điểm tôn giáo ở Việt Nam","Đặc trưng tôn giáo ở Việt Nam","Nguyên tắc giải quyết tôn giáo","Nguồn gốc tôn giáo"],0],[236,"Chủ nghĩa xã hội được tiếp cận từ mấy góc độ ?",["3 góc độ","4 góc độ","5 góc độ","6 góc độ"],1],[237,"Ph. Ăngghen đánh giá “ Hai phát hiện vĩ đại này đã đưa chủ nghĩa xã hội trở thành một khoa học “, vậy hai phát kiến đó là :",["Sứ mệnh lịch sử của giai cấp công nhân – Học thuyết giá trị thặng dư","Chủ nghĩa duy vật biện chứng và chủ nghĩa duy vật lịch sử","Học thuyết giá trị thặng dư – Chủ nghĩa duy vật lịch sử","Sứ mệnh lịch sử của giai cấp công nhân – Chủ nghĩa duy vật lịch sử"],2],[238,"Chủ nghĩa xã hội là chế độ xã hội do ai làm chủ ?",["Tầng lớp trí thức","Giai cấp công nhân","Giai cấp nông dân","Nhân dân lao động"],3],[239,"Đặc điểm chung giữa các nhà nước xã hội chủ nghĩa là :",["Là cơ quan đại diện cho ý chí của nhân dân","Tổ chức thực hiện quyền lực của nhân dân","Thực hiện tổ chức quản lý linh tế, văn hóa, xã hội của nhân dân đặt dưới sự lãnh đạo của Đảng Cộng sản","Tất cả đáp án đều đúng"],3],[240,"Nội dung chính trị của liên minh ở Việt Nam hiện nay thể hiện:",["Thể hiện ở việc giữ vững quan điểm chính trị - tư tưởng của giai cấp công nhân, đồng thời giữ vững vai trò lãnh đạo của Đảng Cộng sản Việt Nam đối với khối liên minh và đối với toàn xã hội...","Thể hiện ở việc giữ vững tư tưởng chính trị - tư tưởng của giai cấp công nhân, đồng thời giữ vững vai trò lãnh đạo của Đảng Cộng sản Việt Nam đối với khối liên minh và đối với toàn xã hội...","Thể hiện ở việc giữ vững hệ tư tưởng chính trị - tư tưởng của giai cấp công nhân, đồng thời giữ vững vai trò lãnh đạo của Đảng Cộng sản Việt Nam đối với khối liên minh và đối với toàn xã hội...","Thể hiện ở việc giữ vững lập trường chính trị - tư tưởng của giai cấp công nhân, đồng thời giữ vững vai trò lãnh đạo của Đảng Cộng sản Việt Nam đối với khối liên minh và đối với toàn xã hội..."],3],[241,"Theo quan điểm của chủ nghĩa Mác – Lênin, có mấy hình thức quá độ lên chủ nghĩa xã hội ?",["1 hình thức","2 hình thức","3 hình thức","4 hình thức"],1]]}];

const allWrong=i=>(i==null?D.map((_,x)=>x):[i]).flatMap(x=>wrongOf(x).map(j=>[x,j]));
let jump=false;
function go(t){const n=t==null?"":(typeof t==="string"?t:"p"+(t+1));if(location.hash==="#"+n||(!n&&!location.hash))render();else location.hash=n}
function home(){
  let td=0,tn=0;D.forEach((p,i)=>{const s=stat(i);td+=s.d;tn+=s.n});
  let rs=D.findIndex((_,i)=>{const s=stat(i);return s.d>0&&s.d<s.n});if(rs<0)rs=D.findIndex((_,i)=>stat(i).d<stat(i).n);

      h("b",{},"Phần "+(i+1)),h("span",{},"Câu "+p.s+"–"+p.e+" · "+s.n+" câu"),
      h("div",{class:"bar"},h("i",{style:"width:"+Math.round(s.d/s.n*100)+"%"})),h("span",{},s.d?(s.d===s.n?"Xong · đúng "+s.r+"/"+s.sc:"Đã làm "+s.d+"/"+s.n):"Chưa làm")))});
  const acts=h("div",{class:"acts"},rs>=0?h("button",{class:"b p",onclick:()=>{jump=true;go(rs)}},"▶ "+(stat(rs).d?"Tiếp tục Phần "+(rs+1)+" ("+stat(rs).d+"/"+stat(rs).n+")":"Bắt đầu Phần "+(rs+1))):"",
    w?h("button",{class:"b",onclick:()=>go("sai")},"🔁 Ôn câu sai ("+w+")"):"");
  app.replaceChildren(h("div",{class:"hero"+(td>0?" mini":""),style:"background-image:url("+IMG.h+")"},h("div",{class:"avs"},IMG.a.map((u,k)=>av(k))),
    h("small",{},"Chủ nghĩa xã hội khoa học"),h("h1",{onclick:()=>{if(++taps%3===0){confetti();lb(Math.floor(Math.random()*3))}}},"Ôn tập CNXHKH"),h("p",{},greet()+" · Qua môn thôi! 💪"),
    h("div",{class:"chips"},h("span",{class:"chip"},tn+" câu"),h("span",{class:"chip"},D.length+" phần"),h("span",{class:"chip"},"Đã làm "+Math.round(td/tn*100)+"%"))),

    acts,g,h("p",{class:"sub"},"Bấm đáp án để biết đúng/sai ngay. Tiến độ lưu trên máy của bạn. Thử chạm vào các ảnh nhé 😉"));
}
/* items: [[phần,câu],...]; retry=true: làm lại câu sai (trạng thái hiển thị tính từ đầu phiên) */
function quiz(cfg){
  const {items,retry,title,sub,pi}=cfg,loc={},single=!!S.m;
  const ans=(i,j)=>retry?loc[i+":"+j]:(S[i]||{})[j];
  const st=()=>{let d=0,r=0,sc=0;items.forEach(([i,j])=>{const q=D[i].q[j],a=ans(i,j);if(q[3]>=0)sc++;if(a!==undefined){d++;if(a===q[3])r++}});return{d,r,sc,n:items.length}};
  let cur=Math.max(0,items.findIndex(([i,j])=>ans(i,j)===undefined));
  const top=h("div",{class:"top"}),list=h("div"),end=h("div");
  function upd(){const s=st();
    top.replaceChildren(h("div",{class:"t"},av(pi==null?0:pi),h("div",{},title,h("small",{},sub+" · "+s.d+"/"+s.n+" · đúng "+s.r+(streak>=3?" · 🔥 "+streak:"")))),
      h("button",{class:"b",onclick:()=>go(null)},"Trang chủ"),h("div",{class:"pbar"},h("i",{style:"width:"+Math.round(s.d/Math.max(1,s.n)*100)+"%"})));
    const pc=s.sc?s.r/s.sc:1,done=s.n>0&&s.d===s.n,left=retry?allWrong(pi).length:0;
    const rb=h("button",{class:"b",onclick:()=>{if(!rb.dataset.c){rb.dataset.c=1;rb.textContent="Chắc chắn xóa? Bấm lần nữa";rb.classList.add("danger");setTimeout(()=>{rb.dataset.c="";rb.textContent="Làm lại phần này";rb.classList.remove("danger")},3500)}else{S[pi]={};save();go(pi)}}},"Làm lại phần này");
    const wn=!retry&&allWrong(pi).length;
    end.replaceChildren(done?h("div",{class:"res"},av(1+(pi||0)),h("b",{},s.r+" / "+s.sc+" câu đúng"),h("p",{},pc>=.9?"Đỉnh của chóp! 🏆 Học bổng gọi tên!":pc>=.7?"Quá tốt! Thêm chút nữa là hoàn hảo 💪":pc>=.5?"Khá ổn! Làm lại để chắc hơn nhé 📚":"Đừng nản, ôn lại là nhớ ngay thôi 🌱")):"",
      items.length?h("div",{class:"nav"},retry?"":rb,wn?h("button",{class:"b",onclick:()=>go("sai"+(pi+1))},"🔁 Ôn câu sai ("+wn+")"):"",
        retry&&left?h("button",{class:"b",onclick:()=>{render()}},"🔁 Ôn tiếp ("+left+" câu)"):"",
        !retry&&pi>0?h("button",{class:"b",onclick:()=>go(pi-1)},"← Phần trước"):"",!retry&&pi<D.length-1?h("button",{class:"b p",onclick:()=>go(pi+1)},"Phần sau →"):""):"")}
  function card(x){const [i,j]=items[x],q=D[i].q[j],a=ans(i,j),done=a!==undefined,
    box=h("div",{class:"q"},h("h3",{},h("em",{},"Câu "+q[0]),q[1]));
    q[2].forEach((t,k)=>{let c="o";if(done){if(k===q[3])c+=" ok";else if(a===k)c+=" no"}
      box.append(h("button",{class:c,disabled:done?"":null,onclick:()=>choose(i,j,k,q)},h("b",{},L[k]),h("span",{},t)))});
    const f=FB[i+":"+j];if(done&&f)box.append(h("div",{class:"fb "+(f.ok?"ok":"no")},h("img",{class:"av",src:IMG.a[f.k],alt:""}),h("span",{},f.msg)));return box}
  function choose(i,j,k,q){const was=st().d;if(!S[i])S[i]={};S[i][j]=k;save();if(retry)loc[i+":"+j]=k;
    const ok=k===q[3];streak=ok?streak+1:0;
    FB[i+":"+j]={ok,msg:{5:"🔥 5 câu liên tiếp!",10:"⚡ 10 câu liên tiếp, quá đỉnh!",20:"👑 20 câu liên tiếp, huyền thoại!"}[streak]||rnd(ok?OKS:NOS),k:Math.floor(Math.random()*3)};
    draw();upd();const s=st();if(was<s.n&&s.d===s.n&&s.sc&&s.r/s.sc>=.7)setTimeout(confetti,250);if(streak===10||streak===20)setTimeout(confetti,200)}
  function draw(){if(single){list.replaceChildren(card(cur),h("div",{class:"nav"},
      h("button",{class:"b",disabled:cur<=0?"":null,onclick:()=>{cur--;draw();scrollTo(0,0)}},"← Trước"),
      h("button",{class:"b p",disabled:cur>=items.length-1?"":null,onclick:()=>{cur++;draw();scrollTo(0,0)}},"Sau →")))}
    else list.replaceChildren(...items.map((_,x)=>card(x)))}
  function toX(x){if(single){cur=x;draw();scrollTo(0,0)}else list.children[x]&&list.children[x].scrollIntoView({behavior:"smooth",block:"start"})}
  function sheet(){const sh=document.getElementById("sheet"),close=()=>sh.classList.remove("on");
    sh.replaceChildren(h("div",{class:"c",onclick:e=>e.stopPropagation()},h("h4",{},"Chọn câu"),
      h("div",{class:"gr"},items.map(([i,j],x)=>{const q=D[i].q[j],a=ans(i,j);return h("button",{class:(a===undefined?"":a===q[3]?"ok":"no")+(single&&x===cur?" cur":""),onclick:()=>{close();toX(x)}},String(x+1))})),
      h("div",{class:"lg"},h("button",{class:"b"+(single?"":" on"),onclick:()=>{S.m=0;save();close();render()}},"☰ Cuộn dài"),h("button",{class:"b"+(single?" on":""),onclick:()=>{S.m=1;save();close();render()}},"▢ Từng câu một")),
      h("div",{class:"lg"},h("button",{class:"b",onclick:close},"Đóng"))));sh.onclick=close;sh.classList.add("on")}
  if(!items.length){app.replaceChildren(h("div",{class:"res"},av(2),h("b",{},"Không có câu sai 🎉"),h("p",{},"Bạn đã làm đúng hết những câu đã làm."),h("div",{class:"nav"},h("button",{class:"b p",onclick:()=>go(null)},"Về trang chủ"))));return}
  const fab=h("button",{class:"fab",onclick:()=>{const f=items.findIndex(([i,j])=>ans(i,j)===undefined);f>=0?toX(f):scrollTo({top:0,behavior:"smooth"})}},"Câu tiếp ↓");
  app.replaceChildren(top,list,end,h("button",{class:"fab l",onclick:sheet},"▦ Câu"),single?"":fab);draw();upd();window.scrollTo(0,0);
  if(jump){jump=false;const f=items.findIndex(([i,j])=>ans(i,j)===undefined);if(f>0&&!single)setTimeout(()=>toX(f),80)}

function render(){const h1=location.hash;let m;
  if(m=/^#sai(\d*)$/.exec(h1)){const pi=m[1]?+m[1]-1:null;if(pi==null||(pi>=0&&pi<D.length))return quiz({items:allWrong(pi),retry:true,title:"Ôn câu sai",sub:pi==null?"Tất cả phần":"Phần "+(pi+1),pi})}
  if(m=/^#p(\d+)$/.exec(h1)){const i=+m[1]-1;if(i>=0&&i<D.length)return quiz({items:D[i].q.map((_,j)=>[i,j]),title:"Phần "+(i+1)+" · Câu "+D[i].s+"–"+D[i].e,sub:"Đã làm",pi:i})}
  home()}
addEventListener("hashchange",render);render();
</script></body></html>
